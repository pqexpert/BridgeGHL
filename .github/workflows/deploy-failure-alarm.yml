name: Inspect or activate deterministic Fabric failure alarm
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, activate]
        default: inspect
        required: true
permissions:
  contents: read
concurrency:
  group: bridgeghl-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 -m unittest discover -s tests -p test_fabric_failure_alarm.py -v
          python3 -m unittest discover -s tests -p test_fabric_alert_mailer.py -v
      - name: Prepare existing SSH transport
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          try:
              raw = os.environ["SSH_PRIVATE_KEY"].strip().replace("\\n", "\n")
              if "PRIVATE KEY" not in raw:
                  raw = base64.b64decode("".join(raw.split()), validate=True).decode().strip()
              p = Path.home() / ".ssh/fabric-preflight"
              p.touch(mode=0o600, exist_ok=False)
              p.write_text(raw + "\n")
          except Exception:
              raise SystemExit("Existing SSH key could not be prepared; value withheld")
          PY
          ssh-keygen -y -f ~/.ssh/fabric-preflight >/dev/null 2>&1
          # Retain the existing deployment's host discovery, not an independent pin.
          ssh-keyscan -T 10 -H "$REMOTE_HOST" > ~/.ssh/fabric-known-hosts 2>/dev/null
          test -s ~/.ssh/fabric-known-hosts

      - name: Reuse existing owner alert schedule
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
          ALARM_MODE: ${{ inputs.mode }}
        run: python3 scripts/deploy_failure_alarm.py
      - name: Cleanup existing transport
        if: always()
        run: rm -f ~/.ssh/fabric-preflight ~/.ssh/fabric-known-hosts

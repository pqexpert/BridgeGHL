name: Deploy BridgeGHL protected runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-zijifabric.yml"

permissions:
  contents: read

concurrency:
  group: bridgeghl-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 10
    env:
      REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
      REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
      HIGHLEVEL_PIT: ${{ secrets.HIGHLEVEL_PIT }}
      HIGHLEVEL_LOCATION_ID: ${{ secrets.HIGHLEVEL_LOC }}
    steps:
      - name: Validate protected inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in REMOTE_HOST REMOTE_USER SSH_PRIVATE_KEY HIGHLEVEL_PIT HIGHLEVEL_LOCATION_ID; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done

      - name: Prepare encrypted transport
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["SSH_PRIVATE_KEY"].strip()
          if "\\n" in raw:
              raw = raw.replace("\\n", "\n")
          if "PRIVATE KEY" not in raw:
              raw = base64.b64decode("".join(raw.split()), validate=True).decode().strip()
          Path.home().joinpath(".ssh/bridgeghl").write_text(raw + "\n")
          PY
          chmod 600 ~/.ssh/bridgeghl
          ssh-keygen -y -f ~/.ssh/bridgeghl >/dev/null
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          umask 077
          printf '%s' "$HIGHLEVEL_PIT" > highlevel.pit
          printf '%s' "$HIGHLEVEL_LOCATION_ID" > highlevel.location

      - name: Migrate binding, restart, and verify
        shell: bash
        run: |
          set -euo pipefail
          remote_pit="/tmp/bridgeghl.pit.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          remote_location="/tmp/bridgeghl.location.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          scp -i ~/.ssh/bridgeghl highlevel.pit "${REMOTE_USER}@${REMOTE_HOST}:${remote_pit}"
          scp -i ~/.ssh/bridgeghl highlevel.location "${REMOTE_USER}@${REMOTE_HOST}:${remote_location}"
          ssh -i ~/.ssh/bridgeghl "${REMOTE_USER}@${REMOTE_HOST}" "PIT_FILE='${remote_pit}' LOCATION_FILE='${remote_location}' bash -s" <<'REMOTE'
          set -euo pipefail
          old_env=/home/bridgeadmin/apps/BridgeGHL/.env
          new_dir=/etc/bridgeghl
          new_env=/etc/bridgeghl/bridgeghl.env
          unit=/etc/systemd/system/bridgeghl.service
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          privilege=()
          if [[ $(id -u) -ne 0 ]]; then privilege=(sudo -n); fi

          source_env=$(ls -1t "$old_env".rollback.* 2>/dev/null | head -n 1)
          if [[ -z "${source_env:-}" ]]; then source_env="$old_env"; fi
          test -s "$source_env"
          test -s "$PIT_FILE"
          test -s "$LOCATION_FILE"

          "${privilege[@]}" install -d -m 700 -o root -g root "$new_dir"
          if [[ -f "$new_env" ]]; then
            "${privilege[@]}" cp -a "$new_env" "$new_env.rollback.$stamp"
          fi
          "${privilege[@]}" cp -a "$unit" "$unit.rollback.$stamp"
          "${privilege[@]}" install -m 600 -o root -g root "$source_env" "$new_env"

          "${privilege[@]}" python3 - "$new_env" "$PIT_FILE" "$LOCATION_FILE" <<'PY'
          from pathlib import Path
          import os, sys
          target, pit_file, location_file = map(Path, sys.argv[1:])
          pit = pit_file.read_text().strip()
          location = location_file.read_text().strip()
          if (pit.startswith("'") and pit.endswith("'")) or (pit.startswith('"') and pit.endswith('"')):
              pit = pit[1:-1].strip()
          if pit.lower().startswith("bearer "):
              pit = pit[7:].strip()
          if not pit or any(ch.isspace() for ch in pit):
              raise SystemExit("replacement PIT has an invalid transport format")
          if not location or any(ch.isspace() for ch in location):
              raise SystemExit("replacement location has an invalid transport format")
          lines = target.read_text().splitlines()
          out, pit_replaced, location_replaced = [], False, False
          for line in lines:
              if line.startswith("HIGHLEVEL_PIT="):
                  out.append("HIGHLEVEL_PIT=" + pit)
                  pit_replaced = True
              elif line.startswith("HIGHLEVEL_LOCATION_ID="):
                  out.append("HIGHLEVEL_LOCATION_ID=" + location)
                  location_replaced = True
              else:
                  out.append(line)
          if not pit_replaced:
              out.append("HIGHLEVEL_PIT=" + pit)
          if not location_replaced:
              out.append("HIGHLEVEL_LOCATION_ID=" + location)
          target.write_text("\n".join(out) + "\n")
          os.chmod(target, 0o600)
          PY

          rm -f "$PIT_FILE" "$LOCATION_FILE"
          "${privilege[@]}" chown root:root "$new_env"
          "${privilege[@]}" restorecon -RF "$new_dir"
          "${privilege[@]}" sed -i 's|^EnvironmentFile=.*|EnvironmentFile=/etc/bridgeghl/bridgeghl.env|' "$unit"
          "${privilege[@]}" restorecon -F "$unit"
          "${privilege[@]}" systemctl daemon-reload
          "${privilege[@]}" systemctl reset-failed bridgeghl.service
          "${privilege[@]}" systemctl restart bridgeghl.service
          "${privilege[@]}" systemctl is-active --quiet bridgeghl.service
          ready=false
          for attempt in {1..15}; do
            if curl --silent --show-error --fail http://127.0.0.1:8000/health >/tmp/bridgeghl-health.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            "${privilege[@]}" systemctl status bridgeghl.service --no-pager --lines=30 || true
            "${privilege[@]}" journalctl -u bridgeghl.service --no-pager -n 50 || true
            exit 1
          fi
          "${privilege[@]}" python3 - "$new_env" <<'PY'
          import json, sys, urllib.request
          from pathlib import Path

          values = {}
          for raw in Path(sys.argv[1]).read_text().splitlines():
              if raw and not raw.lstrip().startswith("#") and "=" in raw:
                  key, value = raw.split("=", 1)
                  values[key.strip()] = value.strip().strip(chr(39)).strip(chr(34))

          health = json.loads(Path("/tmp/bridgeghl-health.json").read_text())
          checks = {item["name"]: item["ok"] for item in health.get("checks", [])}
          required = ("bridge_api_key", "highlevel_pit", "highlevel_location_id",
                      "highlevel_base_url", "audit_log_path", "audit_log_writable")
          if health.get("live_write_enabled") is not False:
              raise SystemExit("live writes must remain disabled")
          if not all(checks.get(name) is True for name in required):
              raise SystemExit("runtime configuration or audit writability check failed")

          api_key = values.get("BRIDGE_API_KEY", "")
          if not api_key:
              raise SystemExit("bridge caller key is missing")
          payload = {
              "opportunity_id": "dry-run-validation-only",
              "changes": {"status": "open"},
              "reason": "post-deployment no-write acceptance",
          }
          request = urllib.request.Request(
              "http://127.0.0.1:8000/dry-run/opportunity/update",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json", "X-API-Key": api_key},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              dry_run = json.load(response)
          if not dry_run.get("accepted") or dry_run.get("mode") != "dry_run":
              raise SystemExit("opportunity dry-run was not accepted")

          tags = [v.strip() for v in values.get("HIGHLEVEL_APPROVED_CONTACT_TAGS", "").split(",") if v.strip()]
          if tags:
              tag_payload = {
                  "contact_id": "dry-run-validation-only",
                  "tags_add": [tags[0]],
                  "tags_remove": [],
                  "reason": "post-deployment no-write acceptance",
              }
              tag_request = urllib.request.Request(
                  "http://127.0.0.1:8000/dry-run/contact/tags",
                  data=json.dumps(tag_payload).encode(),
                  headers={"Content-Type": "application/json", "X-API-Key": api_key},
                  method="POST",
              )
              with urllib.request.urlopen(tag_request, timeout=5) as response:
                  tag_dry_run = json.load(response)
              if not tag_dry_run.get("accepted") or tag_dry_run.get("mode") != "dry_run":
                  raise SystemExit("contact-tag dry-run was not accepted")
          print(json.dumps({
              "service_active": True,
              "live_writes_disabled": True,
              "audit_writable": True,
              "opportunity_dry_run": "accepted",
              "contact_tag_dry_run": "accepted" if tags else "disabled_by_empty_allowlist",
          }))
          PY
          rm -f /tmp/bridgeghl-health.json
          REMOTE

      - name: Verify HighLevel provider authentication
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output provider-response.json --write-out '%{http_code}' \
            --request GET "https://services.leadconnectorhq.com/opportunities/pipelines?locationId=${HIGHLEVEL_LOCATION_ID}" \
            --header "Authorization: Bearer ${HIGHLEVEL_PIT}" \
            --header "Accept: application/json" \
            --header "Version: 2021-07-28")
          echo "HighLevel provider HTTP status: $status"
          if [[ "$status" != "200" ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              body = json.loads(Path("provider-response.json").read_text())
              print({"statusCode": body.get("statusCode"), "message": body.get("message")})
          except Exception:
              print("Provider returned a non-JSON error body")
          PY
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path("provider-response.json").read_text())
          pipelines = body.get("pipelines")
          if not isinstance(pipelines, list) or not pipelines:
              raise SystemExit("provider authentication succeeded but no pipeline mapping was returned")
          print({"provider_authenticated": True, "pipeline_count": len(pipelines)})
          PY
          rm -f provider-response.json

      - name: Remove runner secret material
        if: always()
        shell: bash
        run: rm -f highlevel.pit highlevel.location provider-response.json ~/.ssh/bridgeghl

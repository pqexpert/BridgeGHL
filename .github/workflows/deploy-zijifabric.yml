name: Recover BridgeGHL service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-zijifabric.yml"

permissions:
  contents: read

concurrency:
  group: bridgeghl-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 10
    env:
      REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
      REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["SSH_PRIVATE_KEY"].strip()
          if "\\n" in raw:
              raw = raw.replace("\\n", "\n")
          if "PRIVATE KEY" not in raw:
              raw = base64.b64decode("".join(raw.split()), validate=True).decode().strip()
          Path.home().joinpath(".ssh/bridgeghl").write_text(raw + "\n")
          PY
          chmod 600 ~/.ssh/bridgeghl
          ssh-keygen -y -f ~/.ssh/bridgeghl >/dev/null
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Restore last known runtime binding and diagnose
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/bridgeghl "${REMOTE_USER}@${REMOTE_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          target=/home/bridgeadmin/apps/BridgeGHL/.env
          privilege=()
          if [[ $(id -u) -ne 0 ]]; then privilege=(sudo -n); fi
          rollback=$(ls -1t "$target".rollback.* 2>/dev/null | head -n 1)
          test -n "$rollback"
          "${privilege[@]}" cp -p "$rollback" "$target"
          "${privilege[@]}" chown bridgeadmin:bridgeadmin "$target"
          "${privilege[@]}" systemctl reset-failed bridgeghl.service
          "${privilege[@]}" systemctl start bridgeghl.service || {
            "${privilege[@]}" systemctl status bridgeghl.service --no-pager --lines=30 || true
            "${privilege[@]}" journalctl -u bridgeghl.service --no-pager -n 50 || true
            exit 1
          }
          "${privilege[@]}" systemctl is-active --quiet bridgeghl.service
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          REMOTE

      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/bridgeghl

name: Private VPS website inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/site-inventory.yml"]
permissions:
  contents: read
concurrency:
  group: rsc-site-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 5
    env:
      REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
      REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
    steps:
      - name: Store private inventory on VPS; emit only status
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["SSH_PRIVATE_KEY"].strip().replace("\\n", "\n")
          if "PRIVATE KEY" not in raw:
              raw = base64.b64decode("".join(raw.split()), validate=True).decode().strip()
          p = Path.home() / ".ssh/bridgeghl-mcp"
          p.write_text(raw + "\n")
          p.chmod(0o600)
          PY
          ssh-keygen -y -f ~/.ssh/bridgeghl-mcp >/dev/null
          ssh-keyscan -T 10 -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o LogLevel=ERROR -i ~/.ssh/bridgeghl-mcp "$REMOTE_USER@$REMOTE_HOST" 'sudo -n python3 -' <<'PY'
          import subprocess, json, re, os, tempfile, datetime
          from pathlib import Path
          try:
              result = subprocess.run(['nginx', '-T'], capture_output=True, text=True, timeout=20)
              if result.returncode:
                  print('inventory_verified=false; reason=nginx_unavailable')
                  raise SystemExit(1)
              records = []
              source = None
              for raw in result.stdout.splitlines():
                  line = raw.strip()
                  if line.startswith('# configuration file ') and line.endswith(':'):
                      source = line[len('# configuration file '):-1]
                  match = re.fullmatch(r'(server_name|listen|root|index)\s+([^;{}]+);', line)
                  if match:
                      records.append(dict(source=source, directive=match.group(1), value=match.group(2)))
                  match = re.fullmatch(r'proxy_pass\s+(https?://(?:127\.0\.0\.1|localhost|\[::1\])(?::\d+)?)/?;', line)
                  if match:
                      records.append(dict(source=source, directive='proxy_pass', value=match.group(1)))
              directory = Path('/var/lib/rsc-ops')
              directory.mkdir(mode=0o700, parents=True, exist_ok=True)
              directory.chmod(0o700)
              def probe(args):
                  completed = subprocess.run(args, capture_output=True, text=True, timeout=20)
                  return completed.returncode, completed.stdout.strip()
              _, enforcement = probe(['getenforce'])
              _, unit = probe(['systemctl', 'show', 'nginx', '-p', 'MainPID', '-p', 'ExecStart', '-p', 'ExecReload', '-p', 'FragmentPath'])
              _, journal = probe(['journalctl', '-u', 'nginx', '--since', '2026-09-23 19:00:00 UTC', '--no-pager', '-o', 'cat'])
              # Retain only bind/reload diagnostics, never request logs or environment.
              diagnostic_lines = [line for line in journal.splitlines() if ('bind()' in line or 'Reload failed' in line or 'Failed to reload' in line)][-30:]
              # Nginx can acknowledge systemd reload while reporting a failed bind only in its error log.
              for log_name in re.findall(r'^\\s*error_log\\s+(/var/log/nginx/[^;\\s]+)', result.stdout, re.MULTILINE):
                  log_path = Path(log_name)
                  if log_path.is_file():
                      with log_path.open('rb') as log_stream:
                          log_stream.seek(max(0, log_path.stat().st_size - 131072))
                          tail = log_stream.read().decode('utf-8', errors='replace')
                      diagnostic_lines.extend(line for line in tail.splitlines() if '2026/09/23' in line and 'bind()' in line and '18081' in line)
              diagnostic_lines = diagnostic_lines[-30:]
              preview_denied = any('18081' in line and ('Permission denied' in line or '13:' in line) for line in diagnostic_lines)
              _, sockets = probe(['ss', '-ltnp'])
              import shutil
              pid_match = re.search(r'^MainPID=(\d+)$', unit, re.MULTILINE)
              main_pid = int(pid_match.group(1)) if pid_match else 0
              main_exe = os.readlink('/proc/' + str(main_pid) + '/exe') if main_pid else ''
              main_command = Path('/proc/' + str(main_pid) + '/cmdline').read_bytes().replace(b'\x00', b' ').decode(errors='replace') if main_pid else ''
              executable_matches = main_exe == os.path.realpath(shutil.which('nginx') or '')
              print('nginx_running_executable_matches_cli=' + str(executable_matches).lower())
              print('nginx_running_custom_config=' + str(' -c ' in main_command).lower())
              print('nginx_running_custom_prefix=' + str(' -p ' in main_command).lower())
              print('nginx_configured_error_logs_found=' + str(bool(re.findall(r'^\s*error_log\s+(/var/log/nginx/[^;\s]+)', result.stdout, re.MULTILINE))).lower())
              preview_failure = directory / 'outreach-preview-failure.txt'
              print('preview_failure_record_exists=' + str(preview_failure.exists()).lower())
              runtime_evidence = dict(selinux=enforcement, nginx_unit=unit, master_executable=main_exe, master_command=main_command, bind_errors=diagnostic_lines, listening_sockets=sockets)
              print('preview_bind_permission_denied=' + str(preview_denied).lower())
              print('selinux_enforcing=' + str(enforcement == 'Enforcing').lower())
              # Read-only cutover preflight: keep certificate paths and addresses private.
              import socket
              domains = ('restoration-mt.com', 'restorationsecurityconsultants.com', 'restorationsecurityoutreach.com')
              cert_paths = re.findall(r'^\s*ssl_certificate\s+([^;\s]+);', result.stdout, re.MULTILINE)
              certificates = []
              for cert_path in sorted(set(cert_paths)):
                  if not cert_path.startswith('/') or not Path(cert_path).is_file(): continue
                  expiry = subprocess.run(['openssl','x509','-in',cert_path,'-noout','-checkend','604800'], capture_output=True, timeout=10)
                  matches = {}
                  for domain in domains:
                      tested = subprocess.run(['openssl','x509','-in',cert_path,'-noout','-checkhost',domain], capture_output=True, timeout=10)
                      matches[domain] = tested.returncode == 0 and b'does match certificate' in tested.stdout
                  certificates.append(dict(path=cert_path, valid_next_week=expiry.returncode == 0, matches=matches))
              _, local_addresses = probe(['hostname','-I'])
              local_set = set(local_addresses.split())
              dns = {}
              for domain in domains:
                  try:
                      addresses = sorted({item[4][0] for item in socket.getaddrinfo(domain,443,type=socket.SOCK_STREAM)})
                      dns[domain] = dict(addresses=addresses, points_to_local_host=bool(set(addresses) & local_set))
                  except OSError:
                      dns[domain] = dict(addresses=[], points_to_local_host=False)
                  print(domain + '_dns_points_to_host=' + str(dns[domain]['points_to_local_host']).lower())
                  print(domain + '_certificate_available=' + str(any(c['valid_next_week'] and c['matches'][domain] for c in certificates)).lower())
              print('certificate_manager_available=' + str(bool(shutil.which('certbot'))).lower())
              runtime_evidence['cutover_preflight'] = dict(certificates=certificates, dns=dns, certificate_manager_available=bool(shutil.which('certbot')))
              report = dict(observed_at=datetime.datetime.now(datetime.timezone.utc).isoformat(), records=records,
                            runtime_evidence=runtime_evidence, scope='nginx routes, service paths and bind diagnostics; no environment, credentials, headers or request data')
              fd, name = tempfile.mkstemp(dir=directory, prefix='.inventory-')
              with os.fdopen(fd, 'w') as stream:
                  json.dump(report, stream, indent=2)
                  stream.flush()
                  os.fsync(stream.fileno())
              os.chmod(name, 0o600)
              os.replace(name, directory / 'website-inventory.json')
              saved = json.loads((directory / 'website-inventory.json').read_text())
              assert saved == report
              print('inventory_verified=true; custody=vps_root_only; raw_log_export=false')
              for domain in ('restoration-mt.com', 'restorationsecurityconsultants.com', 'restorationsecurityoutreach.com'):
                  present = any(r['directive']=='server_name' and domain in r['value'].split() for r in records)
                  print(domain + '_vhost_present=' + str(present).lower())
          except Exception:
              print('inventory_verified=false; detail_retained_on_host=false')
              raise SystemExit(1)
          PY
      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/bridgeghl-mcp

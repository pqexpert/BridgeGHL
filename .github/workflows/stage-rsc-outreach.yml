name: Stage RSC outreach on IONOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/stage-rsc-outreach.yml"]
permissions:
  contents: read
concurrency:
  group: bridgeghl-production
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 12
    steps:
      - name: Fetch approved website revision
        uses: actions/checkout@v4
        with:
          repository: pqexpert/rsc-operations-console
          ref: e96a5d2c6185ed85a9dc333270129a784c27cdee
          token: ${{ secrets.GIT_PAT }}
          persist-credentials: false
          sparse-checkout: web/outreach
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build static website without exporting private source
        working-directory: web/outreach
        shell: bash
        run: |
          set -euo pipefail
          if ! npm ci > /tmp/rsc-build.log 2>&1; then echo "dependency_install=false; details_withheld=true"; exit 1; fi
          if ! npm run build >> /tmp/rsc-build.log 2>&1; then echo "static_build=false; details_withheld=true"; exit 1; fi
          test -s dist/index.html
          printf '%s\n' 'e96a5d2c6185ed85a9dc333270129a784c27cdee' > dist/revision.txt
          tar -czf /tmp/rsc-outreach.tar.gz -C dist .
          echo "static_build=true"
      - name: Stage immutable release through existing VPS transport
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["SSH_PRIVATE_KEY"].strip().replace("\\n", "\n")
          if "PRIVATE KEY" not in raw:
              raw = base64.b64decode("".join(raw.split()), validate=True).decode().strip()
          p = Path.home() / ".ssh/rsc-stage"
          p.write_text(raw + "\n")
          p.chmod(0o600)
          PY
          ssh-keygen -y -f ~/.ssh/rsc-stage >/dev/null 2>&1
          ssh-keyscan -T 10 -H "$REMOTE_HOST" > ~/.ssh/rsc-hosts 2>/dev/null
          test -s ~/.ssh/rsc-hosts
          scp -q -o LogLevel=ERROR -o UserKnownHostsFile=~/.ssh/rsc-hosts -o StrictHostKeyChecking=yes -i ~/.ssh/rsc-stage /tmp/rsc-outreach.tar.gz "$REMOTE_USER@$REMOTE_HOST:/tmp/rsc-outreach-e96a5d2.tar.gz"
          ssh -o LogLevel=ERROR -o UserKnownHostsFile=~/.ssh/rsc-hosts -o StrictHostKeyChecking=yes -i ~/.ssh/rsc-stage "$REMOTE_USER@$REMOTE_HOST" 'sudo -n python3 -' <<'PY'
          import tarfile, pathlib, hashlib, json, os, datetime
          revision = 'e96a5d2c6185ed85a9dc333270129a784c27cdee'
          archive = pathlib.Path('/tmp/rsc-outreach-e96a5d2.tar.gz')
          root = pathlib.Path('/var/www/rsc-outreach/releases') / revision
          try:
              root.mkdir(parents=True, exist_ok=True)
              with tarfile.open(archive) as tar:
                  tar.extractall(root, filter='data')
              assert (root / 'revision.txt').read_text().strip() == revision
              assert (root / 'index.html').stat().st_size > 0
              for file in root.rglob('*'):
                  if file.is_file(): file.chmod(0o644)
                  elif file.is_dir(): file.chmod(0o755)
              private = pathlib.Path('/var/lib/rsc-ops')
              private.mkdir(parents=True, exist_ok=True, mode=0o700)
              private.chmod(0o700)
              receipt = private / 'outreach-stage.json'
              receipt.write_text(json.dumps(dict(revision=revision, release=str(root), index_sha256=hashlib.sha256((root/'index.html').read_bytes()).hexdigest(), observed_at=datetime.datetime.now(datetime.timezone.utc).isoformat(), live_cutover=False)))
              receipt.chmod(0o600)
              print('release_staged=true; revision=' + revision + '; live_cutover=false')

              import subprocess, urllib.request, time
              import shutil, re, socket
              enforcement = subprocess.run(['getenforce'], capture_output=True, text=True, check=True).stdout.strip()
              port = 18081
              if enforcement == 'Enforcing':
                  manager = shutil.which('semanage')
                  if not manager:
                      raise SystemExit('preview_policy_inventory_unavailable=true; live_cutover=false')
                  policy = subprocess.run([manager, 'port', '-l'], capture_output=True, text=True, check=True).stdout
                  allowed = set()
                  for line in policy.splitlines():
                      if re.match(r'^http_port_t\\s+tcp\\s+', line):
                          for item in re.split(r',\\s*', re.sub(r'^http_port_t\\s+tcp\\s+', '', line)):
                              if item.strip().isdigit(): allowed.add(int(item.strip()))
                  selected = None
                  for candidate in (8008, 8009, 8080, 8443):
                      if candidate not in allowed: continue
                      try:
                          with socket.socket() as probe: probe.bind(('127.0.0.1', candidate))
                          selected = candidate
                          break
                      except OSError: pass
                  if selected is None:
                      raise SystemExit('preview_available_policy_port=false; live_cutover=false')
                  port = selected
              print('preview_policy_compatible=true; security_policy_changed=false')
              for parent in (root, root.parent, root.parent.parent): parent.chmod(0o755)
              subprocess.run(['restorecon', '-RF', str(root.parent.parent)], check=True, capture_output=True)
              config = pathlib.Path('/etc/nginx/conf.d/rsc-outreach-preview.conf')
              desired = ('server {\n'
                         '    listen 127.0.0.1:' + str(port) + ';\n'
                         '    server_name localhost;\n'
                         '    root ' + str(root) + ';\n'
                         '    index index.html;\n'
                         '    add_header X-Robots-Tag "noindex, nofollow" always;\n'
                         '    location / { try_files $uri $uri/ /index.html; }\n'
                         '}\n')
              previous = config.read_bytes() if config.exists() else None
              if previous is not None and (b'listen 127.0.0.1:' not in previous or b'rsc-outreach/releases/' not in previous):
                  raise SystemExit('preview_config_conflict=true')
              try:
                  config.write_text(desired)
                  config.chmod(0o644)
                  subprocess.run(['restorecon', '-F', str(config)], check=True, capture_output=True)
                  check = subprocess.run(['nginx','-T'], capture_output=True)
                  if check.returncode: raise RuntimeError('nginx_validation')
                  loaded = str(config).encode() in check.stdout
                  print('preview_config_loaded=' + str(loaded).lower())
                  if not loaded: raise RuntimeError('preview_config_not_included')
                  subprocess.run(['systemctl','reload','nginx'], check=True, capture_output=True)
                  for attempt in range(10):
                      try:
                          with urllib.request.urlopen('http://127.0.0.1:' + str(port) + '/revision.txt', timeout=2) as response:
                              assert response.read().decode().strip() == revision
                          break
                      except (OSError, AssertionError):
                          if attempt == 9: raise
                          time.sleep(1)
                  with urllib.request.urlopen('http://127.0.0.1:' + str(port) + '/', timeout=10) as response:
                      assert response.status == 200 and b'<html' in response.read().lower()
                  saved = json.loads(receipt.read_text())
                  saved['loopback_preview_verified'] = True
                  saved['preview_config'] = str(config)
                  receipt.write_text(json.dumps(saved))
                  receipt.chmod(0o600)
                  print('loopback_preview_verified=true; public_dns_changed=false')
              except Exception as error:
                  failure = private / 'outreach-preview-failure.txt'
                  failure.write_text(type(error).__name__ + ': ' + str(error))
                  failure.chmod(0o600)
                  print('preview_error_class=' + type(error).__name__)
                  if isinstance(error, urllib.error.URLError):
                      print('preview_network_errno=' + str(getattr(error.reason, 'errno', None)))
                  if previous is None: config.unlink(missing_ok=True)
                  else: config.write_bytes(previous)
                  subprocess.run(['nginx','-t'], capture_output=True, check=True)
                  subprocess.run(['systemctl','reload','nginx'], capture_output=True, check=True)
                  raise SystemExit('preview_failed=true; prior_config_restored=true')

          finally:
              archive.unlink(missing_ok=True)
          PY
      - name: Remove temporary credentials and build material
        if: always()
        run: rm -f ~/.ssh/rsc-stage ~/.ssh/rsc-hosts /tmp/rsc-outreach.tar.gz /tmp/rsc-build.log

name: Inspect cutover credential bindings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cutover-credential-bindings.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 3
    steps:
      - name: Verify IONOS DNS and SSL access without exposing credentials
        env:
          IONOS_API_KEY: ${{ secrets.IONOS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ.get('IONOS_API_KEY', '').strip()
          if not key:
              raise SystemExit('ionos_credential_available=false')
          domains = {'restoration-mt.com','restorationsecurityconsultants.com','restorationsecurityoutreach.com'}
          def get(path):
              request = urllib.request.Request('https://api.hosting.ionos.com/' + path, headers={'X-API-Key':key,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:
                      print(path.split('?')[0] + '_http=' + str(response.status))
                      return json.load(response)
              except urllib.error.HTTPError as e:
                  print(path.split('?')[0] + '_http=' + str(e.code))
                  raise SystemExit(1)
              except Exception:
                  raise SystemExit('ionos_read_failed=true; details_withheld=true')
          zones = get('dns/v1/zones')
          print(json.dumps({'managed_target_domains': sorted(z['name'] for z in zones if z.get('name') in domains)}))
          quota = get('ssl/v1/certificates/quota')
          print(json.dumps({'certificate_quota':{k:quota.get(k) for k in ('total','used','quotaDetails','flatrate')}}))
          result = get('ssl/v1/certificates?page=1&size=100')
          if isinstance(result,list): certificates=result
          else:
              certificates = next((v for k,v in result.items() if isinstance(v,list) and k not in ('links',)), [])
          found = []
          for c in certificates:
              if not isinstance(c,dict): continue
              names = [c.get('commonName','')] + c.get('alternativeNames',[])
              if any(n.removeprefix('*.') in domains for n in names):
                  found.append({k:c.get(k) for k in ('commonName','certificateType','status','deploymentStatus','validUntil')})
          print(json.dumps({'target_certificates_first_page':found}))
          print('ionos_dns_ssl_read_verified=true; provider_mutation=false')
          PY

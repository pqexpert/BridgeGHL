name: Inspect cutover credential bindings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 3
    steps:
      - name: Read credential names only
        env:
          METADATA_TOKEN: ${{ secrets.GIT_PAT }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ.get('METADATA_TOKEN', '')
          if not token:
              raise SystemExit('metadata_credential_available=false')
          base = 'https://api.github.com/repos/pqexpert/BridgeGHL'
          for scope, path in (
              ('zijifabric', '/environments/zijifabric/secrets'),
              ('repository', '/actions/secrets'),
          ):
              names = []
              page = 1
              while True:
                  request = urllib.request.Request(base + path + '?per_page=100&page=' + str(page),
                      headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                               'X-GitHub-Api-Version': '2022-11-28'})
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = json.load(response)
                  except urllib.error.HTTPError as error:
                      print(scope + '_metadata_http=' + str(error.code))
                      break
                  entries = body.get('secrets', [])
                  names.extend(item['name'] for item in entries)
                  if len(entries) < 100:
                      relevant = sorted(n for n in names if any(s in n.upper() for s in ('IONOS','DNS','CERT','SSL','VPS','TUNNEL')))
                      print(json.dumps({'scope': scope, 'metadata_verified': True, 'relevant_secret_names': relevant}))
                      break
                  page += 1
          PY

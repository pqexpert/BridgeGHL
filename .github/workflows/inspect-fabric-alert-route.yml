name: Inspect existing Fabric alert route
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-fabric-alert-route.yml", "scripts/inspect_fabric_alert_route.py"]
permissions:
  contents: read
concurrency:
  group: bridgeghl-production
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare existing SSH transport
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          try:
              raw = os.environ["SSH_PRIVATE_KEY"].strip().replace("\\n", "\n")
              if "PRIVATE KEY" not in raw:
                  raw = base64.b64decode("".join(raw.split()), validate=True).decode().strip()
              p = Path.home() / ".ssh/fabric-preflight"
              p.touch(mode=0o600, exist_ok=False)
              p.write_text(raw + "\n")
          except Exception:
              raise SystemExit("Existing SSH key could not be prepared; value withheld")
          PY
          ssh-keygen -y -f ~/.ssh/fabric-preflight >/dev/null 2>&1
          # Retain the existing deployment's host discovery, not an independent pin.
          ssh-keyscan -T 10 -H "$REMOTE_HOST" > ~/.ssh/fabric-known-hosts 2>/dev/null
          test -s ~/.ssh/fabric-known-hosts

      - name: Read existing server alert bindings without values
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
        run: |
          ssh -i ~/.ssh/fabric-preflight -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/fabric-known-hosts "${REMOTE_USER}@${REMOTE_HOST}" 'sudo -n python3 -' < scripts/inspect_fabric_alert_route.py
      - name: Inspect existing protected runner binding presence
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MAILGUN_FROM: ${{ secrets.MAILGUN_FROM }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          FABRIC_ALERT_TO: ${{ secrets.FABRIC_ALERT_TO }}
        run: |
          python3 - <<'PYCODE'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from inspect_fabric_alert_route import GROUPS
          print(json.dumps({'stage': 'FABRIC_ALERT_RUNNER_PREFLIGHT', 'groups': {name: {'complete': all(os.environ.get(k) for k in keys), 'present_fields': [k for k in keys if os.environ.get(k)]} for name, keys in GROUPS.items()}, 'recipient_configured': bool(os.environ.get('FABRIC_ALERT_TO')), 'external_messages': 0}))
          PYCODE
      - name: Inspect migration binding names and native services
        env:
          SOURCE_TOKEN: ${{ secrets.GIT_PAT }}
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request, urllib.parse, subprocess, shlex
          base='https://api.github.com/repos/pqexpert/BridgeGHL'
          def get(path):
              req=urllib.request.Request(base+path, headers={'Authorization':'Bearer '+os.environ['SOURCE_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=20) as response: return json.load(response)
          result={}
          import re
          def capabilities(data):
              names=[s['name'] for s in data.get('secrets',[])]
              return {category:any(re.search(pattern,n,re.I) for n in names) for category,pattern in {'jira':'JIRA|ATLASSIAN','google_oauth':'GOOGLE|GCAL|OAUTH|REFRESH','shopify':'SHOPIFY','notion':'NOTION'}.items()}
          print(json.dumps({'stage':'FABRIC_REPOSITORY_BINDING_CAPABILITIES','repository':'BridgeGHL','candidate_presence':capabilities(get('/actions/secrets?per_page=100')),'values_returned':False,'names_returned':False}))
          for env in get('/environments?per_page=100').get('environments',[]):
              name=env['name']
              try:
                  data=get('/environments/'+urllib.parse.quote(name,safe='')+'/secrets?per_page=100')
                  result[name]={'candidate_presence':capabilities(data), 'complete_page':data.get('total_count',0)<=100}
              except Exception as exc: result[name]={'error_type':type(exc).__name__}
          print(json.dumps({'stage':'FABRIC_MIGRATION_BINDING_CAPABILITIES','environments':result}))
          code = """
          import json, pathlib, subprocess
          out={'services':{},'configs':{}}
          for name in ['bridgeghl','bridgeghl-mcp','ziji-distiller']:
              p=subprocess.run(['systemctl','is-active',name+'.service'],capture_output=True,text=True,timeout=5)
              out['services'][name]=p.stdout.strip()
          for path in ['/etc/ziji-fabric/provider.json','/etc/ziji-fabric/alerts.json','/etc/bridgeghl/bridgeghl.env']:
              p=pathlib.Path(path)
              if p.is_file() and not p.is_symlink() and p.stat().st_size<65536:
                  body=p.read_text()
                  keys=sorted(json.loads(body)) if path.endswith('.json') else sorted(line.split('=',1)[0].strip() for line in body.splitlines() if '=' in line and not line.lstrip().startswith('#'))
                  out['configs'][path]={'exists':True,'field_names':keys}
              else: out['configs'][path]={'exists':False}
          for path in ['/var/lib/ziji-fabric/dispatch-shadow/latest.json','/var/lib/ziji-fabric/alerts/latest.json']:
              p=pathlib.Path(path)
              if p.is_file() and not p.is_symlink() and p.stat().st_size<65536:
                  d=json.loads(p.read_text())
                  out[path]={k:d[k] for k in ['observed_at_utc','observed_at','checks','alerts','outcome','model_calls'] if k in d}
          print(json.dumps(out))
          """
          cmd=['ssh','-i',os.path.expanduser('~/.ssh/fabric-preflight'),'-o','BatchMode=yes','-o','StrictHostKeyChecking=yes','-o','UserKnownHostsFile='+os.path.expanduser('~/.ssh/fabric-known-hosts'),os.environ['REMOTE_USER']+'@'+os.environ['REMOTE_HOST'],'sudo -n python3 -c '+shlex.quote(code)]
          p=subprocess.run(cmd,capture_output=True,text=True,timeout=30)
          if p.returncode: raise SystemExit('Native migration inventory failed; details withheld')
          print(json.dumps({'stage':'FABRIC_MIGRATION_NATIVE','inventory':json.loads(p.stdout)}))
          PYCODE
      - name: Remove temporary SSH material
        if: always()
        run: rm -f ~/.ssh/fabric-preflight ~/.ssh/fabric-known-hosts

name: Provision approved Fabric mail binding
on:
  push:
    branches: [main]
    paths: [".github/workflows/provision-fabric-mail-key.yml", "scripts/provision_fabric_mail_key.py", "ops/fabric-mail-key.sealed.json"]
permissions:
  contents: read
concurrency:
  group: bridgeghl-production
  cancel-in-progress: false
jobs:
  binding:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Provision only the approved inbox key
        env:
          SOURCE_TOKEN: ${{ secrets.GIT_PAT }}
        run: python3 scripts/provision_fabric_mail_key.py

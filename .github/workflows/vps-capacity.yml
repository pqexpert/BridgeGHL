name: Inspect IONOS VPS capacity and BridgeGHL routing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"
  push:
    branches: [main]
    paths: [".github/workflows/vps-capacity.yml"]

permissions:
  contents: read

concurrency:
  group: bridgeghl-production
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 5
    env:
      REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
      REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
    steps:
      - name: Inspect live capacity and effective route without reading environment values
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["SSH_PRIVATE_KEY"].strip().replace("\\n", "\n")
          if "PRIVATE KEY" not in raw:
              raw = base64.b64decode("".join(raw.split()), validate=True).decode().strip()
          p = Path.home() / ".ssh/bridgeghl-capacity"
          p.write_text(raw + "\n")
          p.chmod(0o600)
          PY
          ssh-keygen -y -f ~/.ssh/bridgeghl-capacity >/dev/null
          ssh-keyscan -T 10 -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/bridgeghl-capacity -o BatchMode=yes "$REMOTE_USER@$REMOTE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil, subprocess, sys, platform
          from pathlib import Path
          def run(*args):
              p = subprocess.run(args, capture_output=True, text=True, timeout=10)
              return p.stdout.strip() if p.returncode == 0 else ""
          mem = {}
          for line in Path("/proc/meminfo").read_text().splitlines():
              if ":" in line:
                  name, value = line.split(":", 1)
                  if name in ("MemTotal", "MemAvailable", "SwapTotal", "SwapFree"):
                      mem[name] = int(value.strip().split()[0]) // 1024
          disk = shutil.disk_usage("/")
          cpu = os.cpu_count()
          active = run("systemctl", "is-active", "bridgeghl.service")
          enabled = run("systemctl", "is-enabled", "bridgeghl.service")
          configured_env = subprocess.run(["sudo", "-n", "test", "-f", "/etc/bridgeghl/bridgeghl.env"], capture_output=True).returncode == 0
          nginx = run("systemctl", "is-active", "nginx")
          mcp_active = run("systemctl", "is-active", "bridgeghl-mcp.service")
          from urllib.request import urlopen
          try:
              with urlopen("http://127.0.0.1:8000/health", timeout=5) as r:
                  health = json.load(r).get("state", "unknown")
          except Exception:
              health = "unreachable"
          load = os.getloadavg()
          alerts = []
          if mem.get("MemAvailable", 0) < 1024:
              alerts.append("available_ram_below_1gib")
          if disk.free < 30 * 1024**3:
              alerts.append("free_disk_below_30gib")
          if cpu and load[1] > cpu and load[2] > cpu:
              alerts.append("5m_and_15m_load_above_cpu_count")
          if active != "active":
              alerts.append("bridge_service_not_active")
          if mcp_active != "active":
              alerts.append("mcp_service_not_active")
          if health != "HEALTHY":
              alerts.append("bridge_health_not_healthy")
          print(json.dumps({"capacity_alerts": alerts, "load_5m": round(load[1], 2), "load_15m": round(load[2], 2), "status": "attention" if alerts else "healthy"}, sort_keys=True))
          print(json.dumps({"cpu_count":cpu,"load_1m":round(os.getloadavg()[0],2),"mcp_service":mcp_active,"python_version":platform.python_version(),"architecture":platform.machine(),"python311_installed":bool(shutil.which("python3.11")),"python311_pkg_available":subprocess.run(["dnf","list","--available","python3.11","--quiet"],capture_output=True,timeout=30).returncode==0,"memory_mib":mem,"root_disk_gib":{"total":disk.total//(1024**3),"free":disk.free//(1024**3)},"bridgeghl_service":active,"bridgeghl_enabled":enabled,"protected_env_present":configured_env,"nginx_service":nginx,"loopback_health_state":health}, sort_keys=True))
          if alerts:
              raise SystemExit(1)
          PY
          sudo -n python3 - <<'PY_NATIVE'
          import datetime as dt, hashlib, json
          from pathlib import Path
          root = Path('/var/lib/ziji-fabric/native-sources')
          report = {'stage':'NATIVE_MIGRATION_READBACK', 'model_calls':0, 'calendar_writes':0}
          def read(name):
              path = root / name
              if path.is_symlink() or path.stat().st_uid != 0 or path.stat().st_mode & 0o077:
                  raise ValueError('unsafe_state')
              return json.loads(path.read_text())
          def age(value):
              stamp = dt.datetime.fromisoformat(value.replace('Z','+00:00'))
              if stamp.tzinfo is None:
                  raise ValueError('missing_timezone')
              return round((dt.datetime.now(dt.timezone.utc)-stamp).total_seconds())
          try:
              latest = read('latest.json')
              report['collection_age_seconds'] = age(latest['observed_at'])
              report['cron_trigger_recorded'] = latest.get('trigger') == 'cron'
              report['collection_fresh'] = 0 <= report['collection_age_seconds'] <= 4500
              for lane in ('jira','calendar'):
                  status = latest.get(lane,{})
                  snapshot = read(lane+'.json')
                  raw = (root/(lane+'.json')).read_bytes()
                  report[lane] = {
                      'retrieved':status.get('status') == 'retrieved_and_persisted',
                      'digest_matches':hashlib.sha256(raw).hexdigest() == status.get('snapshot_sha256'),
                      'snapshot_age_seconds':age(snapshot['observed_at']),
                      'items':len(snapshot.get('receipt_candidates',snapshot.get('events',[])))}
              current = read('calendar.json')
              prior = read('calendar-previous.json')
              old = {e['id']:e for e in prior['events']}
              common = [(e,old[e['id']]) for e in current['events'] if e['id'] in old]
              marker = 'END FABRIC CURRENT NOTE'
              suffix_pairs = [(a['description'].split(marker,1)[1],b['description'].split(marker,1)[1])
                              for a,b in common if a.get('description','').count(marker)==1 and b.get('description','').count(marker)==1]
              report['calendar_comparison'] = {
                  'prior_age_seconds':age(prior['observed_at']),
                  'common_events':len(common), 'comparable_suffixes':len(suffix_pairs),
                  'unchanged_suffixes':sum(a==b for a,b in suffix_pairs),
                  'recurring_events':sum(bool(e.get('recurringEventId')) for e in current['events']),
                  'writer_allowlist_established':False, 'historical_feedback_consumed':False}
              report['inspection'] = 'completed'
          except Exception:
              report['inspection'] = 'incomplete_details_withheld'
          print(json.dumps(report,sort_keys=True))
          PY_NATIVE
          REMOTE
      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/bridgeghl-capacity

name: Inspect native receipts privately
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Encrypted bounded acceptance inspection
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
        run: python3 scripts/inspect_native_receipts.py

name: Deploy VPS governed MCP adapter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mcp_server.py", "task_contract.py", ".github/workflows/deploy-mcp.yml"]

permissions:
  contents: read

concurrency:
  group: bridgeghl-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 15
    env:
      REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
      REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate MCP adapter
        run: |
          set -euo pipefail
          python -m pip install 'mcp==2.2.0'
          python -m pip download --only-binary=:all: --dest mcp-wheels 'mcp==2.2.0'
          tar -czf mcp-wheels.tgz mcp-wheels
          python -m py_compile mcp_server.py task_contract.py
          python -c 'from mcp_server import SERVER; assert SERVER.name == "BridgeGHL governed CRM"'
      - name: Deploy isolated loopback service
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["SSH_PRIVATE_KEY"].strip().replace("\\n", "\n")
          if "PRIVATE KEY" not in raw:
              raw = base64.b64decode("".join(raw.split()), validate=True).decode().strip()
          p = Path.home() / ".ssh/bridgeghl-mcp"
          p.write_text(raw + "\n")
          p.chmod(0o600)
          PY
          ssh-keygen -y -f ~/.ssh/bridgeghl-mcp >/dev/null
          ssh-keyscan -T 10 -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/bridgeghl-mcp mcp_server.py task_contract.py mcp-wheels.tgz "$REMOTE_USER@$REMOTE_HOST:/tmp/"
          ssh -i ~/.ssh/bridgeghl-mcp "$REMOTE_USER@$REMOTE_HOST" "bash -s -- /tmp/mcp_server.py /tmp/task_contract.py /tmp/mcp-wheels.tgz" <<'REMOTE'
          set -euo pipefail
          source_file="$1"
          contract_file="$2"
          wheel_archive="$3"
          wheel_dir=$(mktemp -d)
          trap 'rm -rf "$wheel_dir" "${rollback_dir:-}" "$source_file" "$contract_file" "$wheel_archive"' EXIT
          tar -xzf "$wheel_archive" -C "$wheel_dir"
          app_dir=/home/bridgeadmin/apps/BridgeGHL
          unit=/etc/systemd/system/bridgeghl-mcp.service
          privilege=()
          if [[ $(id -u) -ne 0 ]]; then privilege=(sudo -n); fi
          test -s "$source_file"
          "${privilege[@]}" test -s /etc/bridgeghl/bridgeghl.env
          # The adapter and bridge deploy independently. Keep the current adapter
          # active until the live backend advertises the matching task contract.
          backend_ready=false
          for attempt in {1..36}; do
            if curl --max-time 8 --fail --silent --show-error \
              http://127.0.0.1:8000/openapi.json | python3 -c '
          import json, sys
          document = json.load(sys.stdin)
          assert document["info"]["version"] == "0.6.0"
          required = {"/dry-run/task/create", "/execute/task/create", "/dry-run/task/delete", "/execute/task/delete"}
          assert required <= set(document["paths"])
          '; then
              backend_ready=true
              break
            fi
            sleep 5
          done
          [[ "$backend_ready" == true ]]
          if ! command -v python3.11 >/dev/null; then
            "${privilege[@]}" dnf -y install python3.11 python3.11-pip
          fi
          python3.11 --version
          "${privilege[@]}" python3.11 -m venv /opt/bridgeghl-mcp-py311
          "${privilege[@]}" /opt/bridgeghl-mcp-py311/bin/python -m pip install --disable-pip-version-check --no-index --find-links="$wheel_dir/mcp-wheels" 'mcp==2.2.0'
          # Validate the exact candidate against the live backend before replacing
          # any production artifact or restarting the service.
          candidate_tools=$(mktemp)
          openapi_file=$(mktemp)
          PYTHONPATH="$(dirname "$source_file")" /opt/bridgeghl-mcp-py311/bin/python - "$candidate_tools" <<'PY'
          import asyncio
          import json
          import sys
          from mcp_server import SERVER

          tools = asyncio.run(SERVER.list_tools())
          with open(sys.argv[1], "w") as handle:
              json.dump({"tools": [tool.model_dump(by_alias=True) for tool in tools]}, handle)
          PY
          curl --max-time 8 --fail --silent --show-error \
            http://127.0.0.1:8000/openapi.json >"$openapi_file"
          /opt/bridgeghl-mcp-py311/bin/python "$contract_file" \
            "$candidate_tools" "$openapi_file"
          rm -f "$candidate_tools" "$openapi_file"
          echo "candidate_task_contract_verified=true"

          rollback_dir=$(mktemp -d)
          had_mcp=false
          had_contract=false
          had_unit=false
          if "${privilege[@]}" test -f "$app_dir/mcp_server.py"; then
            had_mcp=true
            "${privilege[@]}" cp -a "$app_dir/mcp_server.py" "$rollback_dir/mcp_server.py"
          fi
          if "${privilege[@]}" test -f "$app_dir/task_contract.py"; then
            had_contract=true
            "${privilege[@]}" cp -a "$app_dir/task_contract.py" "$rollback_dir/task_contract.py"
          fi
          if "${privilege[@]}" test -f "$unit"; then
            had_unit=true
            "${privilege[@]}" cp -a "$unit" "$rollback_dir/bridgeghl-mcp.service"
          fi

          if (
            set -euo pipefail
            "${privilege[@]}" install -m 644 "$source_file" "$app_dir/mcp_server.py"
            "${privilege[@]}" install -m 644 "$contract_file" "$app_dir/task_contract.py"
            "${privilege[@]}" tee "$unit" >/dev/null <<'UNIT'
          [Unit]
          Description=BridgeGHL governed MCP adapter (loopback only)
          After=network-online.target bridgeghl.service
          Wants=network-online.target
          Requires=bridgeghl.service

          [Service]
          Type=simple
          User=bridgeadmin
          WorkingDirectory=/home/bridgeadmin/apps/BridgeGHL
          EnvironmentFile=/etc/bridgeghl/bridgeghl.env
          ExecStart=/opt/bridgeghl-mcp-py311/bin/python /home/bridgeadmin/apps/BridgeGHL/mcp_server.py
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          ProtectSystem=full
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT
            "${privilege[@]}" systemctl daemon-reload
            "${privilege[@]}" systemctl enable --now bridgeghl-mcp.service
            "${privilege[@]}" systemctl restart bridgeghl-mcp.service
            "${privilege[@]}" systemctl is-active --quiet bridgeghl-mcp.service

            active_verified=false
            for attempt in {1..12}; do
              if response=$(curl --max-time 8 --fail --silent --show-error \
                --header 'Content-Type: application/json' \
                --header 'Accept: application/json, text/event-stream' \
                --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"deploy-check","version":"1"}}}' \
                http://127.0.0.1:8001/mcp) && \
                printf '%s' "$response" | python3 -c 'import json,sys; assert json.load(sys.stdin)["result"]["serverInfo"]["name"] == "BridgeGHL governed CRM"'; then
                health=$(curl --max-time 15 --fail --silent --show-error \
                  --header 'Content-Type: application/json' \
                  --header 'Accept: application/json, text/event-stream' \
                  --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"bridge_health","arguments":{}}}' \
                  http://127.0.0.1:8001/mcp)
                printf '%s' "$health" | python3 -c '
          import json, sys
          def payload(v):
              if isinstance(v, dict):
                  if v.get("plugin_contract"): return v
                  for item in v.values():
                      found = payload(item)
                      if found: return found
              if isinstance(v, list):
                  for item in v:
                      found = payload(item)
                      if found: return found
              if isinstance(v, str) and v.startswith("{"):
                  try: return payload(json.loads(v))
                  except ValueError: return None
              return None
          result = payload(json.load(sys.stdin))
          assert result["state"] == "HEALTHY"
          assert result["plugin_contract"]["version"] == "rsc-command-center-plugin/v1"
          assert result["task_writes_enabled"] is True
          '
                tools_file=$(mktemp)
                live_openapi=$(mktemp)
                curl --max-time 8 --fail --silent --show-error \
                  --header 'Content-Type: application/json' \
                  --header 'Accept: application/json, text/event-stream' \
                  --data '{"jsonrpc":"2.0","id":3,"method":"tools/list","params":{}}' \
                  http://127.0.0.1:8001/mcp >"$tools_file"
                curl --max-time 8 --fail --silent --show-error \
                  http://127.0.0.1:8000/openapi.json >"$live_openapi"
                /opt/bridgeghl-mcp-py311/bin/python "$app_dir/task_contract.py" \
                  "$tools_file" "$live_openapi"
                rm -f "$tools_file" "$live_openapi"
                active_verified=true
                break
              fi
              sleep 1
            done
            [[ "$active_verified" == true ]]
          ); then
            echo "journey_evidence_and_task_tools_discovered=true"
            echo "loopback_mcp_health_verified=true"
            echo "deployment_effect_verified=true"
          else
            set +e
            if [[ "$had_mcp" == true ]]; then
              "${privilege[@]}" install -m 644 "$rollback_dir/mcp_server.py" "$app_dir/mcp_server.py"
            else
              "${privilege[@]}" rm -f "$app_dir/mcp_server.py"
            fi
            if [[ "$had_contract" == true ]]; then
              "${privilege[@]}" install -m 644 "$rollback_dir/task_contract.py" "$app_dir/task_contract.py"
            else
              "${privilege[@]}" rm -f "$app_dir/task_contract.py"
            fi
            if [[ "$had_unit" == true ]]; then
              "${privilege[@]}" install -m 644 "$rollback_dir/bridgeghl-mcp.service" "$unit"
              "${privilege[@]}" systemctl daemon-reload
              "${privilege[@]}" systemctl enable --now bridgeghl-mcp.service
              "${privilege[@]}" systemctl restart bridgeghl-mcp.service
              "${privilege[@]}" systemctl is-active --quiet bridgeghl-mcp.service
            else
              "${privilege[@]}" systemctl disable --now bridgeghl-mcp.service || true
              "${privilege[@]}" rm -f "$unit"
              "${privilege[@]}" systemctl daemon-reload
            fi
            echo "deployment_rolled_back=true"
            exit 1
          fi
          REMOTE
      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/bridgeghl-mcp

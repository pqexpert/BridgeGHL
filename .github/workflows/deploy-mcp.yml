name: Deploy VPS governed MCP adapter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mcp_server.py", ".github/workflows/deploy-mcp.yml"]

permissions:
  contents: read

concurrency:
  group: bridgeghl-mcp-recovery
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 15
    env:
      REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
      REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate MCP adapter
        run: |
          set -euo pipefail
          python -m pip install 'mcp==2.2.0'
          python -m pip download --only-binary=:all: --dest mcp-wheels 'mcp==2.2.0'
          tar -czf mcp-wheels.tgz mcp-wheels
          python -m py_compile mcp_server.py
          python -c 'from mcp_server import SERVER; assert SERVER.name == "BridgeGHL governed CRM"'
      - name: Deploy isolated loopback service
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["SSH_PRIVATE_KEY"].strip().replace("\\n", "\n")
          if "PRIVATE KEY" not in raw:
              raw = base64.b64decode("".join(raw.split()), validate=True).decode().strip()
          p = Path.home() / ".ssh/bridgeghl-mcp"
          p.write_text(raw + "\n")
          p.chmod(0o600)
          PY
          ssh-keygen -y -f ~/.ssh/bridgeghl-mcp >/dev/null
          ssh-keyscan -T 10 -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/bridgeghl-mcp mcp_server.py mcp-wheels.tgz "$REMOTE_USER@$REMOTE_HOST:/tmp/"
          ssh -i ~/.ssh/bridgeghl-mcp "$REMOTE_USER@$REMOTE_HOST" "bash -s -- /tmp/mcp_server.py /tmp/mcp-wheels.tgz" <<'REMOTE'
          set -euo pipefail
          source_file="$1"
          wheel_archive="$2"
          wheel_dir=$(mktemp -d)
          trap 'rm -rf "$wheel_dir" "$source_file" "$wheel_archive"' EXIT
          tar -xzf "$wheel_archive" -C "$wheel_dir"
          app_dir=/home/bridgeadmin/apps/BridgeGHL
          unit=/etc/systemd/system/bridgeghl-mcp.service
          privilege=()
          if [[ $(id -u) -ne 0 ]]; then privilege=(sudo -n); fi
          test -s "$source_file"
          "${privilege[@]}" test -s /etc/bridgeghl/bridgeghl.env
          if ! command -v python3.11 >/dev/null; then
            "${privilege[@]}" dnf -y install python3.11 python3.11-pip
          fi
          python3.11 --version
          "${privilege[@]}" python3.11 -m venv /opt/bridgeghl-mcp-py311
          "${privilege[@]}" /opt/bridgeghl-mcp-py311/bin/python -m pip install --disable-pip-version-check --no-index --find-links="$wheel_dir/mcp-wheels" 'mcp==2.2.0'
          if "${privilege[@]}" test -f "$app_dir/mcp_server.py"; then
            "${privilege[@]}" cp -a "$app_dir/mcp_server.py" "$app_dir/mcp_server.py.rollback.$(date -u +%Y%m%dT%H%M%SZ)"
          fi
          "${privilege[@]}" install -m 644 "$source_file" "$app_dir/mcp_server.py"
          "${privilege[@]}" tee "$unit" >/dev/null <<'UNIT'
          [Unit]
          Description=BridgeGHL governed MCP adapter (loopback only)
          After=network-online.target bridgeghl.service
          Wants=network-online.target
          Requires=bridgeghl.service

          [Service]
          Type=simple
          User=bridgeadmin
          WorkingDirectory=/home/bridgeadmin/apps/BridgeGHL
          EnvironmentFile=/etc/bridgeghl/bridgeghl.env
          ExecStart=/opt/bridgeghl-mcp-py311/bin/python /home/bridgeadmin/apps/BridgeGHL/mcp_server.py
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          ProtectSystem=full
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT
          "${privilege[@]}" systemctl daemon-reload
          "${privilege[@]}" systemctl enable --now bridgeghl-mcp.service
          "${privilege[@]}" systemctl restart bridgeghl-mcp.service
          "${privilege[@]}" systemctl is-active --quiet bridgeghl-mcp.service
          # Bound the probe; GET /mcp is a streaming endpoint and must not be used here.
          for attempt in {1..12}; do
            if response=$(curl --max-time 8 --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"deploy-check","version":"1"}}}' \
              http://127.0.0.1:8001/mcp) && \
              printf '%s' "$response" | python3 -c 'import json,sys; assert json.load(sys.stdin)["result"]["serverInfo"]["name"] == "BridgeGHL governed CRM"'; then
              health=$(curl --max-time 15 --fail --silent --show-error \
                --header 'Content-Type: application/json' \
                --header 'Accept: application/json, text/event-stream' \
                --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"bridge_health","arguments":{}}}' \
                http://127.0.0.1:8001/mcp)
              printf '%s' "$health" | python3 -c '
          import json, sys
          def healthy(v):
              if isinstance(v, dict):
                  return v.get("state") == "HEALTHY" or any(healthy(item) for item in v.values())
              if isinstance(v, list):
                  return any(healthy(item) for item in v)
              if isinstance(v, str) and v.startswith("{"):
                  try: return healthy(json.loads(v))
                  except ValueError: return False
              return False
          assert healthy(json.load(sys.stdin))
          '
              echo "loopback_mcp_health_verified=true"
              exit 0
            fi
            sleep 1
          done
          exit 1
          REMOTE
      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/bridgeghl-mcp

name: Bind governed CRM operational fields
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bridgeghl-production
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 8
    env:
      REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
      REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate syntax
        run: python3 -m py_compile scripts/configure_agent_fields.py
      - name: Resolve native schema and bind reviewed operational fields
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["SSH_PRIVATE_KEY"].strip().replace("\\n", "\n")
          if "PRIVATE KEY" not in raw:
              raw = base64.b64decode("".join(raw.split()), validate=True).decode().strip()
          p = Path.home() / ".ssh/bridgeghl-mcp"
          p.write_text(raw + "\n")
          p.chmod(0o600)
          PY
          ssh-keygen -y -f ~/.ssh/bridgeghl-mcp >/dev/null
          ssh-keyscan -T 10 -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -q -i ~/.ssh/bridgeghl-mcp scripts/configure_agent_fields.py "$REMOTE_USER@$REMOTE_HOST:/tmp/configure_agent_fields.py"
          ssh -o LogLevel=ERROR -i ~/.ssh/bridgeghl-mcp "$REMOTE_USER@$REMOTE_HOST" 'sudo -n install -m 600 /tmp/configure_agent_fields.py /var/lib/bridgeghl/ecosystem/configure_agent_fields.py && rm -f /tmp/configure_agent_fields.py && sudo -n systemd-run --quiet --wait --pipe --collect --property=EnvironmentFile=/etc/bridgeghl/bridgeghl.env /var/lib/bridgeghl/career-import/runner/bin/python /var/lib/bridgeghl/ecosystem/configure_agent_fields.py'
      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/bridgeghl-mcp

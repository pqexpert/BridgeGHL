name: Deploy source ingestion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.py
      - ingestion.py
      - scripts/ingest_drive.py
      - scripts/deploy_ingestion.sh
      - scripts/runtime_ingestion_check.py
      - .github/workflows/deploy-ingestion.yml
permissions:
  contents: read
concurrency:
  group: bridgeghl-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify package
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
          bash -n scripts/deploy_ingestion.sh
      - name: Deploy exact source using existing protected transport
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in REMOTE_HOST REMOTE_USER SSH_PRIVATE_KEY; do test -n "${!name:-}"; done
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ['SSH_PRIVATE_KEY'].strip().replace('\\n', '\n')
          if 'PRIVATE KEY' not in raw:
              raw = base64.b64decode(''.join(raw.split()), validate=True).decode().strip()
          Path.home().joinpath('.ssh/bridgeghl').write_text(raw + '\n')
          PY
          chmod 600 ~/.ssh/bridgeghl
          ssh-keygen -y -f ~/.ssh/bridgeghl >/dev/null
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s' "$GITHUB_SHA" > DEPLOYED_SHA
          tar -czf ingestion-release.tgz app.py ingestion.py scripts/ingest_drive.py scripts/runtime_ingestion_check.py DEPLOYED_SHA
          remote_package="/tmp/bridgeghl-source.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tgz"
          scp -i ~/.ssh/bridgeghl ingestion-release.tgz "${REMOTE_USER}@${REMOTE_HOST}:${remote_package}"
          ssh -i ~/.ssh/bridgeghl "${REMOTE_USER}@${REMOTE_HOST}" "bash -s -- '$remote_package' '$GITHUB_SHA'" < scripts/deploy_ingestion.sh
      - name: Clean up transport material
        if: always()
        run: rm -f ~/.ssh/bridgeghl ingestion-release.tgz DEPLOYED_SHA

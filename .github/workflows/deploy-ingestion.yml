name: Deploy source ingestion
on:
  workflow_dispatch:
    inputs:
      record_highlevel_cutover:
        description: Record and verify the fixed HighLevel operating checkpoint
        type: boolean
        default: false
        required: false
  push:
    branches: [main]
    paths:
      - app.py
      - ingestion.py
      - journey_evidence.py
      - scripts/ingest_drive.py
      - scripts/deploy_ingestion.sh
      - scripts/runtime_ingestion_check.py
      - scripts/run_career_import.sh
      - scripts/bootstrap_career.py
      - scripts/transfer_career_source.py
      - scripts/configure_ecosystem.py
      - scripts/project_career_fields.py
      - scripts/accept_rsc_autonomy.py
      - scripts/record_highlevel_cutover.py
      - .github/workflows/deploy-ingestion.yml
permissions:
  contents: read
concurrency:
  group: bridgeghl-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify package
        run: |
          python -m pip install -r requirements.txt 'mcp==2.2.0' pytest
          python -m pytest -q
          bash -n scripts/deploy_ingestion.sh
      - name: Check current protected provider binding on runner
        env:
          HIGHLEVEL_PIT: ${{ secrets.HIGHLEVEL_PIT }}
          HIGHLEVEL_LOCATION_ID: ${{ secrets.HIGHLEVEL_LOC }}
        run: python3 scripts/runtime_ingestion_check.py
      - name: Deploy exact source using existing protected transport
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in REMOTE_HOST REMOTE_USER SSH_PRIVATE_KEY; do test -n "${!name:-}"; done
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ['SSH_PRIVATE_KEY'].strip().replace('\\n', '\n')
          if 'PRIVATE KEY' not in raw:
              raw = base64.b64decode(''.join(raw.split()), validate=True).decode().strip()
          Path.home().joinpath('.ssh/bridgeghl').write_text(raw + '\n')
          PY
          chmod 600 ~/.ssh/bridgeghl
          ssh-keygen -y -f ~/.ssh/bridgeghl >/dev/null
          test "$REMOTE_HOST" = '74.208.52.45'
          printf '%s\n' '74.208.52.45 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIFH9lGiaAYMJi/KGGPAKPPz0dQGcCWdY8c6eLNlMr79' > ~/.ssh/known_hosts
          printf '%s' "$GITHUB_SHA" > DEPLOYED_SHA
          tar -czf ingestion-release.tgz app.py ingestion.py journey_evidence.py scripts/ingest_drive.py scripts/runtime_ingestion_check.py scripts/configure_ecosystem.py scripts/project_career_fields.py scripts/accept_rsc_autonomy.py scripts/record_highlevel_cutover.py DEPLOYED_SHA
          remote_package="/tmp/bridgeghl-source.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tgz"
          scp -i ~/.ssh/bridgeghl ingestion-release.tgz "${REMOTE_USER}@${REMOTE_HOST}:${remote_package}"
          # RSC production explicitly opts into the bounded task envelope under
          # RBO-97/current principal direction; fresh installs still default closed.
          ssh -i ~/.ssh/bridgeghl "${REMOTE_USER}@${REMOTE_HOST}" "bash -s -- '$remote_package' '$GITHUB_SHA' true" < scripts/deploy_ingestion.sh
      - name: Configure authorized ecosystem and verify isolated canaries
        if: contains(github.event.head_commit.message, '[ecosystem-config]')
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
        run: |
          ssh -i ~/.ssh/bridgeghl "${REMOTE_USER}@${REMOTE_HOST}" 'sudo -n systemd-run --quiet --wait --pipe --collect --property=EnvironmentFile=/etc/bridgeghl/bridgeghl.env /var/lib/bridgeghl/career-import/runner/bin/python /home/bridgeadmin/apps/BridgeGHL/scripts/configure_ecosystem.py --execute'
      - name: Run authorized pinned career ingestion
        if: contains(github.event.head_commit.message, '[career-ingest]')
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
          SOURCE_TOKEN: ${{ secrets.GIT_PAT }}
        run: python3 scripts/transfer_career_source.py
      - name: Project source fields into verified career opportunities
        if: contains(github.event.head_commit.message, '[career-fields]')
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
        run: |
          ssh -i ~/.ssh/bridgeghl "${REMOTE_USER}@${REMOTE_HOST}" 'sudo -n systemd-run --quiet --wait --pipe --collect --property=EnvironmentFile=/etc/bridgeghl/bridgeghl.env /var/lib/bridgeghl/career-import/runner/bin/python /home/bridgeadmin/apps/BridgeGHL/scripts/project_career_fields.py --execute'
      - name: Verify isolated autonomous RSC task cycle
        if: contains(github.event.head_commit.message, '[rsc-autonomy]')
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
        run: |
          ssh -i ~/.ssh/bridgeghl "${REMOTE_USER}@${REMOTE_HOST}" 'sudo -n systemd-run --quiet --wait --pipe --collect --property=EnvironmentFile=/etc/bridgeghl/bridgeghl.env /var/lib/bridgeghl/career-import/runner/bin/python /home/bridgeadmin/apps/BridgeGHL/scripts/accept_rsc_autonomy.py'
      - name: Record authorized HighLevel operating checkpoint
        if: github.event_name == 'workflow_dispatch' && inputs.record_highlevel_cutover == true
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
        run: |
          ssh -i ~/.ssh/bridgeghl "${REMOTE_USER}@${REMOTE_HOST}" 'sudo -n systemd-run --quiet --wait --pipe --collect --property=EnvironmentFile=/etc/bridgeghl/bridgeghl.env /var/lib/bridgeghl/career-import/runner/bin/python /home/bridgeadmin/apps/BridgeGHL/scripts/record_highlevel_cutover.py --execute'
      - name: Clean up transport material
        if: always()
        run: rm -f ~/.ssh/bridgeghl ingestion-release.tgz DEPLOYED_SHA

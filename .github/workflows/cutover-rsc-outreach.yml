name: Inspect RSC outreach public ingress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cutover-rsc-outreach.yml"]

permissions:
  contents: read

concurrency:
  group: bridgeghl-production
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 5
    env:
      REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
      REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
    steps:
      - name: Prepare protected transport
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ['SSH_PRIVATE_KEY'].strip().replace('\\n', '\n')
          if 'PRIVATE KEY' not in raw:
              raw = base64.b64decode(''.join(raw.split()), validate=True).decode().strip()
          key = Path.home() / '.ssh/rsc-ingress-inspect'
          key.write_text(raw + '\n')
          key.chmod(0o600)
          PY
          ssh-keygen -y -f ~/.ssh/rsc-ingress-inspect >/dev/null 2>&1
          ssh-keyscan -T 10 -H "$REMOTE_HOST" > ~/.ssh/rsc-hosts 2>/dev/null
          test -s ~/.ssh/rsc-hosts

      - name: Read host ingress state without mutation
        shell: bash
        run: |
          set -euo pipefail
          ssh -o LogLevel=ERROR -o UserKnownHostsFile="$HOME/.ssh/rsc-hosts" -o StrictHostKeyChecking=yes -i "$HOME/.ssh/rsc-ingress-inspect" "$REMOTE_USER@$REMOTE_HOST" 'sudo -n python3 -' <<'PY'
          import subprocess
          def active(unit):
              return subprocess.run(['systemctl','is-active','--quiet',unit]).returncode == 0
          firewalld = active('firewalld')
          http_runtime = False
          https_runtime = False
          http_permanent = False
          https_permanent = False
          if firewalld:
              http_runtime = subprocess.run(['firewall-cmd','--query-service=http'], capture_output=True).returncode == 0
              https_runtime = subprocess.run(['firewall-cmd','--query-service=https'], capture_output=True).returncode == 0
              http_permanent = subprocess.run(['firewall-cmd','--permanent','--query-service=http'], capture_output=True).returncode == 0
              https_permanent = subprocess.run(['firewall-cmd','--permanent','--query-service=https'], capture_output=True).returncode == 0
          sockets = subprocess.run(['ss','-ltnH'], capture_output=True, text=True, check=True).stdout.splitlines()
          port80 = any(line.split()[3].rsplit(':',1)[-1] == '80' for line in sockets if len(line.split()) >= 4)
          port443 = any(line.split()[3].rsplit(':',1)[-1] == '443' for line in sockets if len(line.split()) >= 4)
          print('ingress_readback=true')
          print('nginx_active=' + str(active('nginx')).lower())
          print('firewalld_active=' + str(firewalld).lower())
          print('firewalld_http_runtime=' + str(http_runtime).lower())
          print('firewalld_https_runtime=' + str(https_runtime).lower())
          print('firewalld_http_permanent=' + str(http_permanent).lower())
          print('firewalld_https_permanent=' + str(https_permanent).lower())
          print('port80_listening=' + str(port80).lower())
          print('port443_listening=' + str(port443).lower())
          PY

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -f ~/.ssh/rsc-ingress-inspect ~/.ssh/rsc-hosts

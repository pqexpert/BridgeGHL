name: Cut over RSC outreach public HTTPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cutover-rsc-outreach.yml"]

permissions:
  contents: read

concurrency:
  group: bridgeghl-production
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 20
    env:
      TARGET_DOMAIN: restorationsecurityoutreach.com
      TARGET_WWW: www.restorationsecurityoutreach.com
      TARGET_REVISION: b2feed67d768d0e29e498b8af6189bb6b23850f9
      CONTACT_EMAIL: inquiries@mg.restorationsecurityoutreach.com
      REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
      REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
      IONOS_API_KEY: ${{ secrets.IONOS_API_KEY }}
    steps:
      - name: Prepare protected transport and DNS helper
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ['SSH_PRIVATE_KEY'].strip().replace('\\n', '\n')
          if 'PRIVATE KEY' not in raw:
              raw = base64.b64decode(''.join(raw.split()), validate=True).decode().strip()
          key = Path.home() / '.ssh/rsc-cutover'
          key.write_text(raw + '\n')
          key.chmod(0o600)
          PY
          ssh-keygen -y -f ~/.ssh/rsc-cutover >/dev/null 2>&1
          ssh-keyscan -T 10 -H "$REMOTE_HOST" > ~/.ssh/rsc-hosts 2>/dev/null
          test -s ~/.ssh/rsc-hosts
          python3 - <<'PY'
          from pathlib import Path
          Path('/tmp/ionos_dns.py').write_text(r'''import collections, hashlib, ipaddress, json, os, socket, sys, unicodedata, urllib.error, urllib.request

          API = 'https://api.hosting.ionos.com/dns/v1'
          DOMAIN = os.environ['TARGET_DOMAIN']
          WWW = os.environ['TARGET_WWW']
          SNAPSHOT = '/tmp/rsc-outreach-dns-before.json'
          key = ''.join(c for c in os.environ.get('IONOS_API_KEY', '').strip() if not c.isspace() and unicodedata.category(c) != 'Cf')
          if not key or any(ord(c) < 32 or ord(c) > 126 for c in key):
              raise SystemExit('ionos_credential_unavailable_or_unsafe=true')

          def request(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              headers = {'X-API-Key': key, 'Accept': 'application/json'}
              if body is not None: headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(API + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return None if not raw else json.loads(raw)
              except urllib.error.HTTPError as exc:
                  print('ionos_operation_http=' + str(exc.code))
                  raise

          def records():
              zones = request('GET', '/zones')
              matches = [z for z in zones if z.get('name', '').rstrip('.') == DOMAIN]
              if len(matches) != 1: raise SystemExit('target_zone_match_count=' + str(len(matches)))
              zone_id = matches[0]['id']
              zone = request('GET', '/zones/' + zone_id)
              values = zone.get('records', []) if isinstance(zone, dict) else []
              if not isinstance(values, list): raise SystemExit('target_zone_records_unavailable=true')
              return zone_id, values

          def is_web(record):
              return record.get('name', '').rstrip('.') in {DOMAIN, WWW} and record.get('type') in {'A','AAAA','CNAME','ALIAS'}

          def type_counts(values):
              return dict(sorted(collections.Counter(r.get('type','UNKNOWN') for r in values).items()))

          def public_shape(record):
              return {k: record.get(k) for k in ('name','type','content','ttl','prio','disabled') if record.get(k) is not None}

          def digest(values):
              shaped = sorted((
                  r.get('name','').rstrip('.'),
                  r.get('type'),
                  r.get('content','').rstrip('.') if r.get('type') in {'CNAME','MX','NS'} else r.get('content'),
                  int(r.get('ttl', 3600)),
                  int(r.get('prio', 0)),
                  bool(r.get('disabled', False)),
              ) for r in values)
              return hashlib.sha256(json.dumps(shaped, separators=(',',':')).encode()).hexdigest()

          def create(zone_id, values):
              return request('POST', '/zones/' + zone_id + '/records', values)

          def delete_web(zone_id, values):
              for record in values:
                  if is_web(record):
                      request('DELETE', '/zones/' + zone_id + '/records/' + record['id'])

          mode = sys.argv[1]
          if mode == 'snapshot':
              zone_id, values = records()
              target_ip = str(ipaddress.IPv4Address(socket.gethostbyname(os.environ['REMOTE_HOST'])))
              snapshot = {
                  'zone_id': zone_id,
                  'full_records': [public_shape(r) for r in values],
                  'web_records': [public_shape(r) for r in values if is_web(r)],
                  'web_digest': digest([r for r in values if is_web(r)]),
                  'nonweb_digest': digest([r for r in values if not is_web(r)]),
                  'nonweb_type_counts': type_counts([r for r in values if not is_web(r)]),
                  'target_ip': target_ip,
              }
              Path = __import__('pathlib').Path
              Path(SNAPSHOT).write_text(json.dumps(snapshot))
              Path(SNAPSHOT).chmod(0o600)
              print('dns_snapshot_saved=true; existing_web_records=' + str(len(snapshot['web_records'])) + '; nonweb_digest=' + snapshot['nonweb_digest'])
          elif mode == 'apply':
              snapshot = json.load(open(SNAPSHOT))
              zone_id, values = records()
              if zone_id != snapshot['zone_id'] or digest([r for r in values if not is_web(r)]) != snapshot['nonweb_digest']:
                  raise SystemExit('dns_pre_effect_cas=false')
              if snapshot['web_records'] or [r for r in values if is_web(r)]:
                  raise SystemExit('unexpected_preexisting_web_records=true')
              desired = [
                  {'name':DOMAIN,'type':'A','content':snapshot['target_ip'],'ttl':300,'prio':0,'disabled':False},
                  {'name':WWW,'type':'CNAME','content':DOMAIN,'ttl':300,'prio':0,'disabled':False},
              ]
              __import__('pathlib').Path('/tmp/rsc-outreach-dns-mutated').touch(mode=0o600)
              create(zone_id, desired)
              zone_id2, after = records()
              root_a = [r for r in after if r.get('name','').rstrip('.') == DOMAIN and r.get('type') == 'A' and r.get('content') == snapshot['target_ip'] and not r.get('disabled',False)]
              www_cname = [r for r in after if r.get('name','').rstrip('.') == WWW and r.get('type') == 'CNAME' and r.get('content','').rstrip('.') == DOMAIN and not r.get('disabled',False)]
              extras = [r for r in after if is_web(r) and r not in root_a and r not in www_cname]
              nonweb_preserved = digest([r for r in after if not is_web(r)]) == snapshot['nonweb_digest']
              print('dns_post_write_counts=root_a:' + str(len(root_a)) + ',www_cname:' + str(len(www_cname)) + ',extras:' + str(len(extras)) + '; nonweb_records_preserved=' + str(nonweb_preserved).lower())
              if not nonweb_preserved:
                  print('dns_nonweb_type_counts_before=' + json.dumps(snapshot['nonweb_type_counts'], sort_keys=True) + '; after=' + json.dumps(type_counts([r for r in after if not is_web(r)]), sort_keys=True))
              if zone_id2 != zone_id or len(root_a) != 1 or len(www_cname) != 1 or extras or not nonweb_preserved:
                  raise SystemExit('dns_post_write_verification=false')
              print('dns_web_cutover_verified=true; root_a=1; www_cname=1; nonweb_records_preserved=true')
          elif mode == 'rollback':
              if not os.path.exists(SNAPSHOT):
                  print('dns_rollback_snapshot_missing=true'); raise SystemExit(0)
              snapshot = json.load(open(SNAPSHOT))
              zone_id, values = records()
              delete_web(zone_id, values)
              zone_id2, after = records()
              web_restored = digest([r for r in after if is_web(r)]) == snapshot['web_digest']
              nonweb_restored = digest([r for r in after if not is_web(r)]) == snapshot['nonweb_digest']
              if zone_id2 != snapshot['zone_id'] or not web_restored or not nonweb_restored:
                  raise SystemExit('dns_rollback_verification=false')
              print('dns_rollback_verified=true; restored_web_records=' + str(len(snapshot['web_records'])) + '; nonweb_records_preserved=true')
          else:
              raise SystemExit('unknown_mode=true')
          ''')
          PY
          chmod 600 /tmp/ionos_dns.py

      - name: Public cutover with automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -o LogLevel=ERROR -o UserKnownHostsFile="$HOME/.ssh/rsc-hosts" -o StrictHostKeyChecking=yes -i "$HOME/.ssh/rsc-cutover" "$REMOTE_USER@$REMOTE_HOST")
          rollback() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "cutover_failed=true; rollback_started=true"
              if [ -f /tmp/rsc-outreach-dns-mutated ]; then
                python3 /tmp/ionos_dns.py rollback || echo "dns_rollback_failed=true"
              else
                echo "dns_rollback_not_needed=true; dns_mutation_started=false"
              fi
              "${SSH[@]}" 'sudo -n python3 -' <<'PY' || echo "nginx_rollback_failed=true"
          import json, pathlib, subprocess
          state = pathlib.Path('/var/lib/rsc-ops/outreach-cutover-rollback.json')
          if not state.exists():
              print('nginx_rollback_state_missing=true')
              raise SystemExit(0)
          saved = json.loads(state.read_text())
          config = pathlib.Path('/etc/nginx/conf.d/rsc-outreach-public.conf')
          backup = pathlib.Path(saved['backup'])
          if saved['prior_exists']:
              config.write_bytes(backup.read_bytes())
              config.chmod(0o644)
          else:
              config.unlink(missing_ok=True)
          subprocess.run(['nginx','-t'], check=True, capture_output=True)
          subprocess.run(['systemctl','reload','nginx'], check=True, capture_output=True)
          print('nginx_rollback_verified=true')
          PY
              exit "$status"
            fi
          }
          trap rollback EXIT

          python3 /tmp/ionos_dns.py snapshot

          "${SSH[@]}" "sudo -n env TARGET_REVISION='$TARGET_REVISION' TARGET_DOMAIN='$TARGET_DOMAIN' TARGET_WWW='$TARGET_WWW' python3 -" <<'PY'
          import datetime, json, pathlib, subprocess, urllib.request
          revision = __import__('os').environ['TARGET_REVISION']
          domain = __import__('os').environ['TARGET_DOMAIN']
          www = __import__('os').environ['TARGET_WWW']
          stage = pathlib.Path('/var/lib/rsc-ops/outreach-stage.json')
          if not stage.exists() or json.loads(stage.read_text()).get('revision') != revision:
              raise SystemExit('staged_revision_cas=false')
          release = pathlib.Path('/var/www/rsc-outreach/releases') / revision
          if not (release / 'revision.txt').exists() or (release / 'revision.txt').read_text().strip() != revision:
              raise SystemExit('release_revision_cas=false')
          if not (release / 'index.html').exists(): raise SystemExit('release_index_missing=true')
          config = pathlib.Path('/etc/nginx/conf.d/rsc-outreach-public.conf')
          runtime = subprocess.run(['nginx','-T'], capture_output=True, text=True, check=True)
          if not config.exists() and (domain in runtime.stdout or www in runtime.stdout):
              raise SystemExit('public_vhost_conflict=true')
          private = pathlib.Path('/var/lib/rsc-ops')
          private.mkdir(parents=True, exist_ok=True, mode=0o700)
          private.chmod(0o700)
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          backup = private / ('rsc-outreach-public.conf.before-' + stamp)
          prior_exists = config.exists()
          backup.write_bytes(config.read_bytes() if prior_exists else b'')
          backup.chmod(0o600)
          state = private / 'outreach-cutover-rollback.json'
          state.write_text(json.dumps({'prior_exists':prior_exists,'backup':str(backup),'revision':revision,'observed_at':stamp}))
          state.chmod(0o600)
          webroot = pathlib.Path('/var/www/letsencrypt')
          webroot.mkdir(parents=True, exist_ok=True)
          webroot.chmod(0o755)
          desired = f'''server {{
              listen 80;
              server_name {domain} {www};
              root {release};
              index index.html;
              location ^~ /.well-known/acme-challenge/ {{ root {webroot}; }}
              location / {{ try_files $uri $uri/ /index.html; }}
          }}
          '''
          try:
              config.write_text(desired)
              config.chmod(0o644)
              subprocess.run(['restorecon','-F',str(config)], check=True, capture_output=True)
              subprocess.run(['nginx','-t'], check=True, capture_output=True)
              subprocess.run(['systemctl','reload','nginx'], check=True, capture_output=True)
              loaded = subprocess.run(['nginx','-T'], capture_output=True, text=True, check=True).stdout
              if str(release) not in loaded or ('server_name ' + domain + ' ' + www) not in loaded:
                  raise RuntimeError('http_vhost_not_loaded')
              print('http_vhost_prepared=true; staged_revision_verified=true; nginx_config_loaded=true; rollback_saved=true')
          except Exception:
              if prior_exists: config.write_bytes(backup.read_bytes())
              else: config.unlink(missing_ok=True)
              subprocess.run(['nginx','-t'], check=True, capture_output=True)
              subprocess.run(['systemctl','reload','nginx'], check=True, capture_output=True)
              raise
          PY

          python3 /tmp/ionos_dns.py apply

          python3 - <<'PY'
          import os, socket, time
          target = socket.gethostbyname(os.environ['REMOTE_HOST'])
          names = [os.environ['TARGET_DOMAIN'], os.environ['TARGET_WWW']]
          for attempt in range(40):
              ok = True
              for name in names:
                  try:
                      addresses = {item[4][0] for item in socket.getaddrinfo(name, 80, family=socket.AF_INET)}
                  except OSError:
                      addresses = set()
                  ok = ok and target in addresses
              if ok:
                  print('public_dns_resolution_verified=true; attempts=' + str(attempt + 1))
                  break
              if attempt == 39: raise SystemExit('public_dns_resolution_timeout=true')
              time.sleep(15)
          PY

          "${SSH[@]}" "sudo -n env TARGET_REVISION='$TARGET_REVISION' TARGET_DOMAIN='$TARGET_DOMAIN' TARGET_WWW='$TARGET_WWW' CONTACT_EMAIL='$CONTACT_EMAIL' python3 -" <<'PY'
          import datetime, hashlib, json, os, pathlib, ssl, subprocess, urllib.request
          revision = os.environ['TARGET_REVISION']
          domain = os.environ['TARGET_DOMAIN']
          www = os.environ['TARGET_WWW']
          email = os.environ['CONTACT_EMAIL']
          release = pathlib.Path('/var/www/rsc-outreach/releases') / revision
          webroot = pathlib.Path('/var/www/letsencrypt')
          certbot = subprocess.run([
              'certbot','certonly','--webroot','-w',str(webroot),'--non-interactive','--agree-tos',
              '--email',email,'--cert-name',domain,'--keep-until-expiring','-d',domain,'-d',www
          ], capture_output=True, text=True)
          if certbot.returncode:
              raise SystemExit('certificate_issue_failed=true')
          live = pathlib.Path('/etc/letsencrypt/live') / domain
          cert = live / 'fullchain.pem'
          key = live / 'privkey.pem'
          if not cert.exists() or not key.exists(): raise SystemExit('certificate_files_missing=true')
          config = pathlib.Path('/etc/nginx/conf.d/rsc-outreach-public.conf')
          desired = f'''server {{
              listen 80;
              server_name {domain} {www};
              location ^~ /.well-known/acme-challenge/ {{ root {webroot}; }}
              location / {{ return 301 https://{domain}$request_uri; }}
          }}
          server {{
              listen 443 ssl http2;
              server_name {www};
              ssl_certificate {cert};
              ssl_certificate_key {key};
              ssl_protocols TLSv1.2 TLSv1.3;
              return 301 https://{domain}$request_uri;
          }}
          server {{
              listen 443 ssl http2;
              server_name {domain};
              root {release};
              index index.html;
              ssl_certificate {cert};
              ssl_certificate_key {key};
              ssl_protocols TLSv1.2 TLSv1.3;
              add_header X-Content-Type-Options nosniff always;
              add_header Referrer-Policy strict-origin-when-cross-origin always;
              location / {{ try_files $uri $uri/ /index.html; }}
          }}
          '''
          config.write_text(desired)
          config.chmod(0o644)
          subprocess.run(['restorecon','-F',str(config)], check=True, capture_output=True)
          subprocess.run(['nginx','-t'], check=True, capture_output=True)
          subprocess.run(['systemctl','reload','nginx'], check=True, capture_output=True)
          context = ssl.create_default_context()
          request = urllib.request.Request('https://127.0.0.1/revision.txt', headers={'Host':domain})
          # curl supplies the correct SNI while forcing loopback.
          local = subprocess.run(['curl','--noproxy','*','--fail','--silent','--show-error','--resolve',domain + ':443:127.0.0.1','https://' + domain + '/revision.txt'], capture_output=True, text=True, check=True)
          if local.stdout.strip() != revision: raise SystemExit('local_tls_revision_mismatch=true')
          cert_info = subprocess.run(['openssl','x509','-in',str(cert),'-noout','-enddate'], capture_output=True, text=True, check=True).stdout.strip()
          receipt = pathlib.Path('/var/lib/rsc-ops/outreach-cutover.json')
          receipt.write_text(json.dumps({
              'revision':revision,'canonical':'https://' + domain + '/',
              'config_sha256':hashlib.sha256(config.read_bytes()).hexdigest(),
              'certificate_enddate':cert_info,'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'rollback_state':'/var/lib/rsc-ops/outreach-cutover-rollback.json','live_cutover':True
          }))
          receipt.chmod(0o600)
          print('tls_vhost_verified=true; exact_revision=' + revision + '; canonical_https=true; rollback_pointer_saved=true')
          PY

          python3 - <<'PY'
          import os, re, ssl, urllib.request
          domain = os.environ['TARGET_DOMAIN']
          www = os.environ['TARGET_WWW']
          revision = os.environ['TARGET_REVISION']
          def read(url):
              req = urllib.request.Request(url, headers={'User-Agent':'RSC-cutover-verifier/1.0'})
              with urllib.request.urlopen(req, timeout=30, context=ssl.create_default_context()) as response:
                  return response.geturl(), response.status, response.read()
          final, status, body = read('https://' + domain + '/revision.txt')
          if status != 200 or body.decode().strip() != revision: raise SystemExit('public_revision_verification=false')
          home_url, home_status, html = read('https://' + domain + '/')
          if home_status != 200 or not home_url.startswith('https://' + domain): raise SystemExit('canonical_home_verification=false')
          scripts = re.findall(rb'<script[^>]+src=["\\\']([^"\\\']+)', html)
          bundle = b''
          for src in scripts:
              path = src.decode()
              if path.startswith('http'): url = path
              else: url = 'https://' + domain + ('/' if not path.startswith('/') else '') + path
              bundle += read(url)[2]
          checks = {
              'cta_form': b'9zWr6fBAogBrgwvT5iYl' in bundle,
              'privacy_link': b'/privacy-policy' in bundle,
              'terms_link': b'/terms-of-service' in bundle,
          }
          if not all(checks.values()): raise SystemExit('public_bundle_acceptance=false')
          for path in ('/privacy-policy/','/terms-of-service/'):
              url, code, page = read('https://' + domain + path)
              if code != 200 or b'<html' not in page.lower(): raise SystemExit('policy_deep_link_failed=' + path)
          www_url, www_status, _ = read('https://' + www + '/revision.txt')
          if www_status != 200 or not www_url.startswith('https://' + domain + '/'): raise SystemExit('www_canonical_redirect=false')
          print('public_revision_verified=true; public_https_verified=true; canonical_www_redirect=true; primary_cta_verified=true; policy_links_verified=true')
          PY

          "${SSH[@]}" 'sudo -n python3 -' <<'PY'
          import json, pathlib, subprocess
          receipt = pathlib.Path('/var/lib/rsc-ops/outreach-cutover.json')
          data = json.loads(receipt.read_text())
          if not data.get('live_cutover'): raise SystemExit('native_cutover_receipt_invalid=true')
          config = pathlib.Path('/etc/nginx/conf.d/rsc-outreach-public.conf')
          if not config.exists(): raise SystemExit('native_cutover_config_missing=true')
          subprocess.run(['nginx','-t'], check=True, capture_output=True)
          print('native_cutover_receipt_readback=true; revision=' + data['revision'] + '; live_cutover=true')
          PY

          trap - EXIT
          echo "cutover_success=true; rollback_not_needed=true"

      - name: Remove temporary credentials and DNS state
        if: always()
        shell: bash
        run: rm -f ~/.ssh/rsc-cutover ~/.ssh/rsc-hosts /tmp/ionos_dns.py /tmp/rsc-outreach-dns-before.json /tmp/rsc-outreach-dns-mutated

name: Restore original RSC outreach DNS records

on:
  push:
    branches: [main]
    paths: [".github/workflows/restore-rsc-outreach-original-dns.yml"]

permissions:
  contents: read

concurrency:
  group: bridgeghl-production
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 10
    env:
      TARGET_DOMAIN: restorationsecurityoutreach.com
      TARGET_WWW: www.restorationsecurityoutreach.com
      IONOS_API_KEY: \${{ secrets.IONOS_API_KEY }}
      REMOTE_HOST: \${{ secrets.BRIDGEGHL_VPS_IP }}
      REMOTE_USER: \${{ secrets.BRIDGEGHL_VPS_USER }}
      SSH_PRIVATE_KEY: \${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
    steps:
      - name: Prepare protected evidence custody
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ['SSH_PRIVATE_KEY'].strip().replace('\\n', '\n')
          if 'PRIVATE KEY' not in raw:
              raw = base64.b64decode(''.join(raw.split()), validate=True).decode().strip()
          key = Path.home() / '.ssh/rsc-dns-recovery'
          key.write_text(raw + '\n')
          key.chmod(0o600)
          PY
          ssh-keygen -y -f ~/.ssh/rsc-dns-recovery >/dev/null 2>&1
          ssh-keyscan -T 10 -H "$REMOTE_HOST" > ~/.ssh/rsc-hosts 2>/dev/null
          test -s ~/.ssh/rsc-hosts
          BACKUP_DIR="/var/lib/rsc-ops/dns-backups/rsc-outreach-original-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "BACKUP_DIR=$BACKUP_DIR" >> "$GITHUB_ENV"
          ssh -o LogLevel=ERROR -o UserKnownHostsFile="$HOME/.ssh/rsc-hosts" -o StrictHostKeyChecking=yes -i "$HOME/.ssh/rsc-dns-recovery" "$REMOTE_USER@$REMOTE_HOST" \
            "sudo -n install -d -m 700 -o root -g root '$BACKUP_DIR'"

      - name: Snapshot current provider zone and persist before-state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, ipaddress, json, os, pathlib, unicodedata, urllib.error, urllib.request

          API = 'https://api.hosting.ionos.com/dns/v1'
          DOMAIN = os.environ['TARGET_DOMAIN']
          WWW = os.environ['TARGET_WWW']
          key = ''.join(c for c in os.environ.get('IONOS_API_KEY', '').strip()
                        if not c.isspace() and unicodedata.category(c) != 'Cf')
          if not key or any(ord(c) < 32 or ord(c) > 126 for c in key):
              raise SystemExit('ionos_credential_unavailable_or_unsafe=true')

          def request(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              headers = {'X-API-Key': key, 'Accept': 'application/json'}
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(API + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return None if not raw else json.loads(raw)
              except urllib.error.HTTPError as exc:
                  print('ionos_operation_http=' + str(exc.code))
                  raise

          def current():
              zones = request('GET', '/zones')
              matches = [z for z in zones if z.get('name', '').rstrip('.') == DOMAIN]
              if len(matches) != 1:
                  raise SystemExit('target_zone_match_count=' + str(len(matches)))
              zone_id = matches[0]['id']
              zone = request('GET', '/zones/' + zone_id)
              values = zone.get('records', []) if isinstance(zone, dict) else []
              if not isinstance(values, list):
                  raise SystemExit('target_zone_records_unavailable=true')
              return zone_id, values

          def target_scope(record):
              return record.get('name', '').rstrip('.') in {DOMAIN, WWW} and record.get('type') in {'A', 'AAAA'}

          def digest(values):
              shaped = sorted((
                  r.get('name', '').rstrip('.'),
                  r.get('type'),
                  r.get('content', '').rstrip('.') if r.get('type') in {'CNAME', 'MX', 'NS'} else r.get('content'),
                  int(r.get('ttl', 3600)),
                  int(r.get('prio', 0)),
                  bool(r.get('disabled', False)),
              ) for r in values if r.get('type') != 'SOA')
              return hashlib.sha256(json.dumps(shaped, separators=(',', ':')).encode()).hexdigest()

          zone_id, records = current()
          protected = [r for r in records if not target_scope(r)]
          snapshot = {
              'observed_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'source_evidence': 'RBO-97-comment-11454',
              'zone_id': zone_id,
              'records': records,
              'target_record_count': len([r for r in records if target_scope(r)]),
              'protected_digest': digest(protected),
          }
          path = pathlib.Path('/tmp/rsc-outreach-dns-before.json')
          path.write_text(json.dumps(snapshot, sort_keys=True, separators=(',', ':')))
          path.chmod(0o600)
          print('dns_before_snapshot=true; current_target_records=' + str(snapshot['target_record_count']) +
                '; protected_digest=' + snapshot['protected_digest'])
          PY
          cat /tmp/rsc-outreach-dns-before.json | \
            ssh -o LogLevel=ERROR -o UserKnownHostsFile="$HOME/.ssh/rsc-hosts" -o StrictHostKeyChecking=yes -i "$HOME/.ssh/rsc-dns-recovery" "$REMOTE_USER@$REMOTE_HOST" \
              "sudo -n tee '$BACKUP_DIR/before.json' >/dev/null && sudo -n chmod 600 '$BACKUP_DIR/before.json' && sudo -n chown root:root '$BACKUP_DIR/before.json'"
          ssh -o LogLevel=ERROR -o UserKnownHostsFile="$HOME/.ssh/rsc-hosts" -o StrictHostKeyChecking=yes -i "$HOME/.ssh/rsc-dns-recovery" "$REMOTE_USER@$REMOTE_HOST" \
            "sudo -n sha256sum '$BACKUP_DIR/before.json' | sed 's#  .*#  before.json#'"

      - name: Add only missing exact original tuples and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, ipaddress, json, os, pathlib, traceback, unicodedata, urllib.error, urllib.request

          API = 'https://api.hosting.ionos.com/dns/v1'
          DOMAIN = os.environ['TARGET_DOMAIN']
          WWW = os.environ['TARGET_WWW']
          BEFORE = pathlib.Path('/tmp/rsc-outreach-dns-before.json')
          AFTER = pathlib.Path('/tmp/rsc-outreach-dns-after.json')
          RECEIPT = pathlib.Path('/tmp/rsc-outreach-dns-recovery-receipt.json')
          DESIRED = [
              {'name': DOMAIN, 'type': 'A', 'content': '212.227.222.65', 'ttl': 3600, 'prio': 0, 'disabled': False, 'source_ui_record_id': '1496904584'},
              {'name': DOMAIN, 'type': 'AAAA', 'content': '2001:8d8:fe:0:0:0:0:65', 'ttl': 3600, 'prio': 0, 'disabled': False, 'source_ui_record_id': '1496904581'},
              {'name': WWW, 'type': 'A', 'content': '74.208.236.247', 'ttl': 3600, 'prio': 0, 'disabled': False, 'source_ui_record_id': '1496904585'},
              {'name': WWW, 'type': 'AAAA', 'content': '2607:f1c0:100f:f000:0:0:0:200', 'ttl': 3600, 'prio': 0, 'disabled': False, 'source_ui_record_id': '1496904583'},
          ]
          key = ''.join(c for c in os.environ.get('IONOS_API_KEY', '').strip()
                        if not c.isspace() and unicodedata.category(c) != 'Cf')
          if not key or any(ord(c) < 32 or ord(c) > 126 for c in key):
              raise SystemExit('ionos_credential_unavailable_or_unsafe=true')

          def request(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              headers = {'X-API-Key': key, 'Accept': 'application/json'}
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(API + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return None if not raw else json.loads(raw)
              except urllib.error.HTTPError as exc:
                  print('ionos_operation_http=' + str(exc.code))
                  raise

          def current():
              zones = request('GET', '/zones')
              matches = [z for z in zones if z.get('name', '').rstrip('.') == DOMAIN]
              if len(matches) != 1:
                  raise RuntimeError('target_zone_match_count=' + str(len(matches)))
              zone_id = matches[0]['id']
              zone = request('GET', '/zones/' + zone_id)
              values = zone.get('records', []) if isinstance(zone, dict) else []
              if not isinstance(values, list):
                  raise RuntimeError('target_zone_records_unavailable=true')
              return zone_id, values

          def target_scope(record):
              return record.get('name', '').rstrip('.') in {DOMAIN, WWW} and record.get('type') in {'A', 'AAAA'}

          def canonical_content(record):
              value = str(record.get('content', '')).rstrip('.')
              if record.get('type') in {'A', 'AAAA'}:
                  return str(ipaddress.ip_address(value))
              return value

          def exact(record, desired):
              return (
                  record.get('name', '').rstrip('.') == desired['name'] and
                  record.get('type') == desired['type'] and
                  canonical_content(record) == str(ipaddress.ip_address(desired['content'])) and
                  int(record.get('ttl', 3600)) == desired['ttl'] and
                  int(record.get('prio', 0)) == desired['prio'] and
                  bool(record.get('disabled', False)) == desired['disabled']
              )

          def digest(values):
              shaped = sorted((
                  r.get('name', '').rstrip('.'),
                  r.get('type'),
                  r.get('content', '').rstrip('.') if r.get('type') in {'CNAME', 'MX', 'NS'} else r.get('content'),
                  int(r.get('ttl', 3600)),
                  int(r.get('prio', 0)),
                  bool(r.get('disabled', False)),
              ) for r in values if r.get('type') != 'SOA')
              return hashlib.sha256(json.dumps(shaped, separators=(',', ':')).encode()).hexdigest()

          before = json.loads(BEFORE.read_text())
          receipt = {
              'observed_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'source_evidence': 'RBO-97-comment-11454',
              'outcome': 'FAIL',
              'backup_dir': os.environ['BACKUP_DIR'],
          }
          exit_error = None
          try:
              zone_id, fresh = current()
              if zone_id != before['zone_id']:
                  raise RuntimeError('zone_id_changed=true')
              fresh_protected = digest([r for r in fresh if not target_scope(r)])
              if fresh_protected != before['protected_digest']:
                  raise RuntimeError('protected_records_changed_before_effect=true')

              missing = [d for d in DESIRED if not any(exact(r, d) for r in fresh)]
              payload = [{k: d[k] for k in ('name', 'type', 'content', 'ttl', 'prio', 'disabled')} for d in missing]
              if payload:
                  request('POST', '/zones/' + zone_id + '/records', payload)

              zone_id_after, after = current()
              protected_after = digest([r for r in after if not target_scope(r)])
              counts = [sum(1 for r in after if exact(r, d)) for d in DESIRED]
              target_after = [r for r in after if target_scope(r)]
              extras = [r for r in target_after if not any(exact(r, d) for d in DESIRED)]
              if zone_id_after != zone_id:
                  raise RuntimeError('zone_id_changed_after_effect=true')
              if protected_after != before['protected_digest']:
                  raise RuntimeError('protected_records_changed_after_effect=true')
              if counts != [1, 1, 1, 1]:
                  raise RuntimeError('exact_original_tuple_counts=' + json.dumps(counts))
              if extras:
                  raise RuntimeError('unexpected_target_records_after_effect=' + str(len(extras)))

              after_snapshot = {
                  'observed_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'source_evidence': 'RBO-97-comment-11454',
                  'zone_id': zone_id_after,
                  'records': after,
                  'protected_digest': protected_after,
              }
              AFTER.write_text(json.dumps(after_snapshot, sort_keys=True, separators=(',', ':')))
              AFTER.chmod(0o600)
              receipt.update({
                  'outcome': 'SUCCESS',
                  'added_count': len(missing),
                  'already_present_count': 4 - len(missing),
                  'verified_exact_tuple_counts': counts,
                  'protected_digest_before': before['protected_digest'],
                  'protected_digest_after': protected_after,
                  'restored_provider_record_ids': [
                      [r.get('id') for r in after if exact(r, d)][0] for d in DESIRED
                  ],
                  'source_ui_record_ids': [d['source_ui_record_id'] for d in DESIRED],
                  'firewall_changed': False,
                  'cutover_retried': False,
              })
              print('dns_original_restoration_verified=true; added=' + str(len(missing)) +
                    '; already_present=' + str(4 - len(missing)) +
                    '; exact_records=4; protected_records_preserved=true')
          except Exception as exc:
              exit_error = exc
              receipt['error'] = str(exc)
              try:
                  zone_id_after, after = current()
                  after_snapshot = {
                      'observed_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      'source_evidence': 'RBO-97-comment-11454',
                      'zone_id': zone_id_after,
                      'records': after,
                      'recovery_error': str(exc),
                  }
                  AFTER.write_text(json.dumps(after_snapshot, sort_keys=True, separators=(',', ':')))
                  AFTER.chmod(0o600)
              except Exception as read_exc:
                  receipt['post_failure_read_error'] = str(read_exc)
          finally:
              RECEIPT.write_text(json.dumps(receipt, sort_keys=True, separators=(',', ':')))
              RECEIPT.chmod(0o600)

          if exit_error is not None:
              raise exit_error
          PY

      - name: Persist post-state and receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for item in /tmp/rsc-outreach-dns-after.json /tmp/rsc-outreach-dns-recovery-receipt.json; do
            if [ -f "$item" ]; then
              name=$(basename "$item")
              cat "$item" | \
                ssh -o LogLevel=ERROR -o UserKnownHostsFile="$HOME/.ssh/rsc-hosts" -o StrictHostKeyChecking=yes -i "$HOME/.ssh/rsc-dns-recovery" "$REMOTE_USER@$REMOTE_HOST" \
                  "sudo -n tee '$BACKUP_DIR/$name' >/dev/null && sudo -n chmod 600 '$BACKUP_DIR/$name' && sudo -n chown root:root '$BACKUP_DIR/$name'"
            fi
          done
          ssh -o LogLevel=ERROR -o UserKnownHostsFile="$HOME/.ssh/rsc-hosts" -o StrictHostKeyChecking=yes -i "$HOME/.ssh/rsc-dns-recovery" "$REMOTE_USER@$REMOTE_HOST" \
            "sudo -n find '$BACKUP_DIR' -maxdepth 1 -type f -printf '%f\n' | sort && sudo -n sha256sum '$BACKUP_DIR'/*.json | sed 's#  .*/#  #'"

      - name: Remove temporary credentials and evidence
        if: always()
        shell: bash
        run: rm -f ~/.ssh/rsc-dns-recovery ~/.ssh/rsc-hosts /tmp/rsc-outreach-dns-before.json /tmp/rsc-outreach-dns-after.json /tmp/rsc-outreach-dns-recovery-receipt.json

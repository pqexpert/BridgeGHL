name: Governance contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Install MCP adapter dependency
        if: matrix.python-version != '3.9'
        run: pip install 'mcp==2.2.0'
      - name: Compile core bridge
        run: python -m py_compile app.py
      - name: Compile MCP adapter
        if: matrix.python-version != '3.9'
        run: python -m py_compile mcp_server.py task_contract.py
      - name: Core governance contract tests
        if: matrix.python-version == '3.9'
        run: python -m pytest -q --ignore=tests/test_mcp_server.py --ignore=tests/test_task_contract.py
      - name: Full governance contract tests
        if: matrix.python-version != '3.9'
        run: python -m pytest -q

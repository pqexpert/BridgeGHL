name: Deploy Fabric read-only server shadow
on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/deploy-fabric-shadow.yml", "scripts/deploy_fabric_shadow.py", "scripts/diagnose_rsc_autonomy.py", "tests/test_fabric_shadow.py"]
  push:
    branches: [main]
    paths: [".github/workflows/deploy-fabric-shadow.yml", "scripts/deploy_fabric_shadow.py", "scripts/diagnose_rsc_autonomy.py"]
permissions:
  contents: read
concurrency:
  group: bridgeghl-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_fabric_shadow.py -v
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: zijifabric
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare existing SSH transport
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.BRIDGEGHL_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          try:
              raw = os.environ["SSH_PRIVATE_KEY"].strip().replace("\\n", "\n")
              if "PRIVATE KEY" not in raw:
                  raw = base64.b64decode("".join(raw.split()), validate=True).decode().strip()
              p = Path.home() / ".ssh/fabric-preflight"
              p.touch(mode=0o600, exist_ok=False)
              p.write_text(raw + "\n")
          except Exception:
              raise SystemExit("Existing SSH key could not be prepared; value withheld")
          PY
          ssh-keygen -y -f ~/.ssh/fabric-preflight >/dev/null 2>&1
          # Retain the existing deployment's host discovery, not an independent pin.
          ssh-keyscan -T 10 -H "$REMOTE_HOST" > ~/.ssh/fabric-known-hosts 2>/dev/null
          test -s ~/.ssh/fabric-known-hosts

      - name: Install pinned read-only shadow on existing cron
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
          SOURCE_TOKEN: ${{ secrets.GIT_PAT }}
        run: python3 scripts/deploy_fabric_shadow.py
      - name: Read isolated RSC canary state without replay
        env:
          REMOTE_HOST: ${{ secrets.BRIDGEGHL_VPS_IP }}
          REMOTE_USER: ${{ secrets.BRIDGEGHL_VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/fabric-preflight -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/fabric-known-hosts scripts/diagnose_rsc_autonomy.py "${REMOTE_USER}@${REMOTE_HOST}:/tmp/diagnose-rsc-${GITHUB_RUN_ID}.py"
          ssh -i ~/.ssh/fabric-preflight -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/fabric-known-hosts "${REMOTE_USER}@${REMOTE_HOST}" "sudo -n install -m 644 /tmp/diagnose-rsc-${GITHUB_RUN_ID}.py /home/bridgeadmin/apps/BridgeGHL/scripts/diagnose_rsc_autonomy.py && rm /tmp/diagnose-rsc-${GITHUB_RUN_ID}.py && sudo -n systemd-run --quiet --wait --pipe --collect --property=EnvironmentFile=/etc/bridgeghl/bridgeghl.env /var/lib/bridgeghl/career-import/runner/bin/python /home/bridgeadmin/apps/BridgeGHL/scripts/diagnose_rsc_autonomy.py"
      - name: Remove temporary SSH material
        if: always()
        run: rm -f ~/.ssh/fabric-preflight ~/.ssh/fabric-known-hosts
